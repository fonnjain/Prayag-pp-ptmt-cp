openapi: 3.1.0
info:
  title: Api
  version: 1.0.0
servers:
  - url: /api
paths:
  /healthz:
    get:
      operationId: getHealthz
      tags: [system]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /v1/plan/items:
    get:
      operationId: getV1PlanItems
      tags: [v1ReadOnly]
      security: [{ apiKeyAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ApiMonth"
        - $ref: "#/components/parameters/ApiSegment"
      responses:
        "200":
          description: Locally cached normalized plan items
          headers: { X-Data-Cache-State: { schema: { type: string } }, X-Data-Cache-Age: { schema: { type: integer } } }
          content: { application/json: { schema: { $ref: "#/components/schemas/V1PlanItemsResponse" } } }
        "400": { $ref: "#/components/responses/V1BadRequest" }
        "401": { $ref: "#/components/responses/V1Unauthorized" }
        "403": { $ref: "#/components/responses/V1Forbidden" }
        "429": { $ref: "#/components/responses/V1RateLimited" }
        "503": { $ref: "#/components/responses/V1CacheUnavailable" }
  /v1/calendar:
    get:
      operationId: getV1Calendar
      tags: [v1ReadOnly]
      security: [{ apiKeyAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/ApiMonth" }, { $ref: "#/components/parameters/ApiSegment" }]
      responses:
        "200": { description: Locally cached working calendar, content: { application/json: { schema: { $ref: "#/components/schemas/V1CalendarResponse" } } } }
        "400": { $ref: "#/components/responses/V1BadRequest" }
        "401": { $ref: "#/components/responses/V1Unauthorized" }
        "403": { $ref: "#/components/responses/V1Forbidden" }
        "429": { $ref: "#/components/responses/V1RateLimited" }
        "503": { $ref: "#/components/responses/V1CacheUnavailable" }
  /v1/summary:
    get:
      operationId: getV1Summary
      tags: [v1ReadOnly]
      security: [{ apiKeyAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/ApiMonth" }, { $ref: "#/components/parameters/ApiSegment" }]
      responses:
        "200": { description: Locally cached plant summary, content: { application/json: { schema: { $ref: "#/components/schemas/V1SummaryResponse" } } } }
        "400": { $ref: "#/components/responses/V1BadRequest" }
        "401": { $ref: "#/components/responses/V1Unauthorized" }
        "403": { $ref: "#/components/responses/V1Forbidden" }
        "429": { $ref: "#/components/responses/V1RateLimited" }
        "503": { $ref: "#/components/responses/V1CacheUnavailable" }
  /v1/categories:
    get:
      operationId: getV1Categories
      tags: [v1ReadOnly]
      security: [{ apiKeyAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/ApiMonth" }, { $ref: "#/components/parameters/ApiSegment" }]
      responses:
        "200": { description: Locally cached category summary, content: { application/json: { schema: { $ref: "#/components/schemas/V1CategoriesResponse" } } } }
        "400": { $ref: "#/components/responses/V1BadRequest" }
        "401": { $ref: "#/components/responses/V1Unauthorized" }
        "403": { $ref: "#/components/responses/V1Forbidden" }
        "429": { $ref: "#/components/responses/V1RateLimited" }
        "503": { $ref: "#/components/responses/V1CacheUnavailable" }

  /buffer-categories:
    get:
      operationId: listBufferCategories
      tags: [bufferCategories]
      parameters:
        - name: segment
          in: query
          required: false
          schema: { type: string, default: "PTMT" }
          description: "Filter by segment: PTMT or Plumbing"
      responses:
        "200":
          description: List of buffer categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BufferCategory"

  /buffer-categories/{id}:
    patch:
      operationId: updateBufferCategory
      tags: [bufferCategories]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BufferCategoryUpdate"
      responses:
        "200":
          description: Updated buffer category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BufferCategory"
        "404":
          description: Not found

  /buffer-categories/recompute:
    post:
      operationId: recomputeSeasonality
      tags: [bufferCategories]
      summary: Recompute seasonality engine for all PTMT categories
      parameters:
        - name: z
          in: query
          required: false
          schema: { type: number, default: 1.65 }
          description: "z-score for service level (1.28=90%, 1.65=95%, 2.05=98%)"
        - name: segment
          in: query
          required: false
          schema: { type: string, default: "PTMT" }
      responses:
        "200":
          description: Recompute triggered; returns updated categories
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeasonalityRecomputeResult"
        "500":
          description: Engine error

  /uploads:
    get:
      operationId: listUploads
      tags: [uploads]
      responses:
        "200":
          description: List of uploaded source files
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UploadedFile"

  /uploads/{kind}:
    post:
      operationId: createUpload
      tags: [uploads]
      parameters:
        - name: kind
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UploadKind"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                period:
                  type: string
                  pattern: '^\d{4}-(0[1-9]|1[0-2])$'
                  description: Planning month represented by this upload (YYYY-MM).
      responses:
        "201":
          description: Uploaded file processed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadedFile"
        "400":
          description: Invalid file

  /sync/sheets:
    post:
      operationId: syncSheets
      tags: [sync]
      responses:
        "200":
          description: Sync results per source
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SyncSource"

  /sync/status:
    get:
      operationId: getSyncStatus
      tags: [sync]
      responses:
        "200":
          description: Current status of each live sheet source
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SyncSource"

  /master-products/source-categories:
    get:
      operationId: getMasterProductSourceCategories
      tags: [masterProducts]
      summary: Read the upstream catalogue vocabulary without mutating local data
      responses:
        "200":
          description: Distinct upstream divisions and categories with mapping status
          content:
            application/json:
              schema: { type: object }
        "502":
          description: Upstream catalogue unavailable or invalid

  /master-products/category-mappings:
    get:
      operationId: listMasterProductCategoryMappings
      tags: [masterProducts]
      summary: List reviewed many-to-one catalogue category mappings
      responses:
        "200":
          description: Reviewed mappings
          content:
            application/json:
              schema: { type: array, items: { type: object } }
    put:
      operationId: upsertMasterProductCategoryMapping
      tags: [masterProducts]
      summary: Save a reviewed catalogue category mapping
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [division, segment, planningCategory]
              properties:
                division: { type: string }
                rawCategory: { type: [string, "null"] }
                segment: { type: string, enum: [PTMT, Plumbing, CP] }
                planningCategory: { type: string }
      responses:
        "200": { description: Mapping saved }
        "400": { description: Invalid or unsafe mapping }

  /master-products/sync:
    post:
      operationId: syncMasterProducts
      tags: [masterProducts]
      summary: Sync the maintained catalogue copy from Prayag-Competition-Analysis
      responses:
        "200":
          description: Sync counts and source vocabulary report
          content:
            application/json:
              schema: { type: object }
        "502": { description: Upstream catalogue unavailable or sync failed }

  /master-products/coverage:
    get:
      operationId: getMasterProductCoverage
      tags: [masterProducts]
      summary: Compare active catalogue codes with the existing item master
      responses:
        "200":
          description: Per-segment coverage, including review details
          content:
            application/json:
              schema: { type: object }

  /master-products/rate-list-report:
    get:
      operationId: getMasterProductRateListReport
      tags: [masterProducts]
      summary: Report the governed PTMT rate-list source and July stock reconciliation
      responses:
        "200":
          description: Rate-list provenance and reconciliation report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RateListReport" }
        "500": { description: Rate-list report unavailable }

  /master-products/mrp-report:
    get:
      operationId: getMasterProductMrpReport
      tags: [masterProducts]
      summary: Show authoritative MRP provenance, coverage, disagreements, and the PTMT hold
      responses:
        "200":
          description: Authoritative MRP review report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MrpReport" }
        "500": { description: MRP report unavailable }

  /master-products/mrp/import:
    post:
      operationId: importMasterProductMrp
      tags: [masterProducts]
      summary: Import and hold an authoritative MRP workbook for review
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "201":
          description: MRP workbook imported and held for approval
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MrpImportResult" }
        "400": { description: Invalid MRP workbook }
        "401": { description: Authentication required }
        "403": { description: Admin access required }

  /master-products/products:
    get:
      operationId: listMasterProducts
      tags: [masterProducts]
      summary: List the complete product review roster for a planning segment
      parameters:
        - name: segment
          in: query
          required: false
          schema: { type: string, enum: [PTMT, Plumbing, CP], default: PTMT }
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [classified, unclassified, ambiguous] }
        - name: category
          in: query
          required: false
          schema: { type: string }
        - name: source
          in: query
          required: false
          schema: { type: string, enum: [workbook, rate-list, catalogue, seed] }
        - name: search
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Products with classification, source, demand, and buffer provenance
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductListResponse" }
        "400": { description: Invalid filter }
        "500": { description: Product roster unavailable }

  /master-products/products/{itemCode}/{colour}:
    patch:
      operationId: reclassifyMasterProduct
      tags: [masterProducts]
      summary: Reclassify a planning-roster product with an audit reason
      parameters:
        - name: itemCode
          in: path
          required: true
          schema: { type: string }
        - name: colour
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductReclassificationInput" }
      responses:
        "200": { description: Product reclassified }
        "400": { description: Invalid reclassification }
        "404": { description: Product is not in the planning roster }

  /corrective/replan:
    post:
      operationId: runCorrectiveReplan
      tags: [corrective]
      summary: Run the weekly corrective re-plan engine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CorrectiveReplanInput"
      responses:
        "200":
          description: Corrective re-plan result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CorrectiveReplanResult"
        "400":
          description: Bad request
        "422":
          description: Required finalized Temporary Plan or PTMT capacity input is unavailable
        "500":
          description: Engine error

  /corrective/runs:
    get:
      operationId: listCorrectiveRuns
      tags: [corrective]
      parameters:
        - name: month
          in: query
          required: false
          schema: { type: string }
        - name: segment
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: List of corrective plan runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CorrectivePlanRunSummary"

  /corrective/runs/{id}:
    get:
      operationId: getCorrectiveRun
      tags: [corrective]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Full corrective run with items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CorrectiveReplanResult"
        "404":
          description: Not found
    delete:
      operationId: deleteCorrectiveRun
      tags: [corrective]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Run deleted
        "404":
          description: Run not found
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string }
        "409":
          description: Pinned run cannot be deleted
          content:
            application/json:
              schema:
                type: object
                required: [error, code, runId]
                properties:
                  error: { type: string }
                  code: { type: string }
                  runId: { type: integer }

  /corrective/runs/{id}/pin:
    patch:
      operationId: pinCorrectiveRun
      tags: [corrective]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pinned]
              properties:
                pinned: { type: boolean }
      responses:
        "200":
          description: Pin status updated
          content:
            application/json:
              schema:
                type: object
                required: [runId, pinned, message]
                properties:
                  runId: { type: integer }
                  pinned: { type: boolean }
                  message: { type: string }
        "404":
          description: Run not found
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string }

  /corrective/runs/{id}/export/excel:
    get:
      operationId: exportCorrectiveExcel
      tags: [corrective]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Excel workbook
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        "404":
          description: Not found

  /corrective/runs/{id}/export/pdf:
    get:
      operationId: exportCorrectivePdf
      tags: [corrective]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: PDF report
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "404":
          description: Not found

  /corrective/export/excel:
    get:
      operationId: exportLatestCorrectiveExcel
      tags: [corrective]
      parameters:
        - name: month
          in: query
          required: true
          schema: { type: string }
        - name: segment
          in: query
          required: false
          schema: { type: string, default: "PTMT" }
      responses:
        "200":
          description: Excel workbook for latest corrective run
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        "404":
          description: No corrective run found for month/segment

  /corrective/export/pdf:
    get:
      operationId: exportLatestCorrectivePdf
      tags: [corrective]
      parameters:
        - name: month
          in: query
          required: true
          schema: { type: string }
        - name: segment
          in: query
          required: false
          schema: { type: string, default: "PTMT" }
      responses:
        "200":
          description: PDF report for latest corrective run
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "404":
          description: No corrective run found for month/segment

  /capacity/categories:
    get:
      operationId: listCategoryCapacities
      tags: [capacity]
      parameters:
        - name: segment
          in: query
          required: false
          schema: { type: string, default: "PTMT" }
          description: "Filter by segment: PTMT or Plumbing"
      responses:
        "200":
          description: List of per-category production capacities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CategoryCapacity"

  /capacity/categories/{category}:
    patch:
      operationId: updateCategoryCapacity
      tags: [capacity]
      parameters:
        - name: category
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryCapacityUpdate"
      responses:
        "200":
          description: Updated category capacity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryCapacity"
        "404":
          description: Not found

  /capacity/recompute:
    post:
      operationId: recomputeCategoryCapacity
      tags: [capacity]
      summary: Recompute per-category capacity from trailing actuals
      parameters:
        - name: trailingDays
          in: query
          required: false
          schema: { type: integer, default: 90 }
        - name: segment
          in: query
          required: false
          schema: { type: string, default: "PTMT" }
          description: "Segment to recompute: PTMT or Plumbing"
      responses:
        "200":
          description: Recomputed category capacities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CategoryCapacity"
        "500":
          description: Engine error

  /capacity/machines:
    get:
      operationId: listPlumbingMachines
      tags: [capacity]
      parameters:
        - name: segment
          in: query
          required: false
          schema: { type: string, default: "Plumbing" }
          description: "Segment (Plumbing)"
        - name: month
          in: query
          required: false
          schema: { type: string }
          description: "YYYY-MM — if provided, includes per-machine utilisation"
      responses:
        "200":
          description: Machine configs with optional per-week utilisation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MachineCapacityResponse"
        "500":
          description: Server error

  /capacity/machines/{machineId}:
    put:
      operationId: updatePlumbingMachine
      tags: [capacity]
      parameters:
        - name: machineId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlumbingMachineUpdate"
      responses:
        "200":
          description: Updated machine
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlumbingMachine"
        "404":
          description: Not found

  /plan:
    get:
      operationId: listPlanItems
      tags: [plan]
      parameters:
        - name: month
          in: query
          required: true
          schema: { type: string }
        - name: segment
          in: query
          required: false
          schema: { type: string, default: "PTMT" }
        - name: category
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Computed production plan line items for the month
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlanItem"

  /plan/summary:
    get:
      operationId: getPlanSummary
      tags: [plan]
      parameters:
        - name: month
          in: query
          required: true
          schema: { type: string }
        - name: segment
          in: query
          required: false
          schema: { type: string, default: "PTMT" }
      responses:
        "200":
          description: Per-category and grand totals for the month
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanSummary"

  /plan/available-months:
    get:
      operationId: listAvailableMonths
      tags: [plan]
      responses:
        "200":
          description: Months with at least one plan run or frozen plant snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailableMonthsResponse"

  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      responses:
        "200":
          description: Top-level dashboard snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSnapshot"

  /plan/export/excel:
    get:
      operationId: exportPlanExcel
      tags: [plan]
      parameters:
        - name: month
          in: query
          required: true
          schema: { type: string }
        - name: segment
          in: query
          required: false
          schema: { type: string, default: "PTMT" }
      responses:
        "200":
          description: Excel workbook of the finalized capacity-fitted production plan, including Cannot Be Made per item
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary

  /plan/export/temporary-excel:
    get:
      operationId: exportTemporaryPlanExcel
      tags: [plan]
      description: "Export-only demand-true Temporary Plan from the latest finalized temporary run. It is the demand source before machine capacity is applied."
      parameters:
        - name: month
          in: query
          required: true
          schema: { type: string }
        - name: segment
          in: query
          required: false
          schema: { type: string, default: "PTMT" }
      responses:
        "200":
          description: Excel workbook of the demand-true Temporary Plan
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary

  /plan/export/pdf:
    get:
      operationId: exportPlanPdf
      tags: [plan]
      parameters:
        - name: month
          in: query
          required: true
          schema: { type: string }
        - name: segment
          in: query
          required: false
          schema: { type: string, default: "PTMT" }
      responses:
        "200":
          description: PDF report of the production plan
          content:
            application/pdf:
              schema:
                type: string
                format: binary

  /plan/export/weekly-excel:
    get:
      operationId: exportWeeklyReleaseExcel
      tags: [plan]
      parameters:
        - name: month
          in: query
          required: true
          schema: { type: string }
        - name: segment
          in: query
          required: false
          schema: { type: string, default: "PTMT" }
      responses:
        "200":
          description: Excel workbook of the finalized capacity-fitted weekly allocation; its Summary asserts Σ W1..W4 = Production Plan total
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary

  /plan/bom-quality:
    get:
      operationId: getPlumbingBomQuality
      tags: [plan]
      description: "Data-quality report: lists Plumbing plan items with no BOM weight entry (~3% of planned pcs). These show 0 kg and must be flagged in UI."
      parameters:
        - name: month
          in: query
          required: true
          schema: { type: string }
        - name: segment
          in: query
          required: false
          schema: { type: string, default: "Plumbing" }
      responses:
        "200":
          description: BOM data-quality report
          content:
            application/json:
              schema:
                type: object
                required: [segment, month, totalItems, missingBomItems, missingPcs, totalPcs, missingPct]
                properties:
                  segment: { type: string }
                  month: { type: string }
                  totalItems: { type: integer }
                  missingBomItems:
                    type: array
                    items:
                      type: object
                      required: [itemCode, colour, category, pcs]
                      properties:
                        itemCode: { type: string }
                        colour: { type: string }
                        category: { type: string }
                        pcs: { type: number }
                  missingPcs: { type: integer }
