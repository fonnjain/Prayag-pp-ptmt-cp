      operationId: getPlantLiveSummary
      tags: [plantLive]
      summary: Machine-level performance summary from prayag-plant.com live API
      parameters:
        - name: period
          in: query
          required: false
          schema: { type: string, default: "last_updated" }
          description: "Period token e.g. last_updated, last_month, 2026-07"
        - name: plant
          in: query
          required: false
          schema: { type: string }
          description: "Plant code e.g. PTMT, PIPE, GARDEN"
        - name: segment
          in: query
          required: false
          schema: { type: string }
          description: "Segment filter"
        - name: machine
          in: query
          required: false
          schema: { type: string }
          description: "Machine filter"
      responses:
        "200":
          description: Summary with by_machine and by_date breakdowns
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlantLiveSummaryResponse"
        "502":
          description: Upstream API unreachable, returned non-JSON, or redirected the API request to sign-in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlantLiveError"
        "503":
          description: PRAYAG_PLANT_API_KEY not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlantLiveError"

  /alerts:
    get:
      operationId: getAlerts
      tags: [alerts]
      parameters:
        - name: month
          in: query
          required: true
          schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
        - name: segment
          in: query
          required: true
          schema: { type: string, enum: [PTMT, Plumbing] }
      responses:
        "200":
          description: Evaluated alert rules for one segment and month
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertsResponse" }
        "400": { description: Invalid alert scope }
        "502": { description: Alert evaluation failed }

  /alerts/history:
    get:
      operationId: getAlertsHistory
      tags: [alerts]
      parameters:
        - name: segment
          in: query
          required: true
          schema: { type: string, enum: [PTMT, Plumbing] }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        "200":
          description: Alert state-change history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertHistoryResponse" }

  /alerts/{id}/acknowledge:
    patch:
      operationId: acknowledgeAlert
      tags: [alerts]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Alert acknowledged
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertActionResponse" }
        "401": { description: Authentication required }
        "403": { description: Admin access required }

  /alerts/{id}/mute:
    patch:
      operationId: muteAlert
      tags: [alerts]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MuteAlertRequest" }
      responses:
        "200":
          description: Alert muted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertActionResponse" }
        "400": { description: Invalid mute request }
        "401": { description: Authentication required }
        "403": { description: Admin access required }

  /alerts/thresholds/{code}:
    put:
      operationId: updateAlertThreshold
      tags: [alerts]
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string, enum: [R1, R2, R3, R4, R5, R6, R7] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateAlertThresholdRequest" }
      responses:
        "200":
          description: Threshold updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertThresholdActionResponse" }
        "400": { description: Invalid threshold }
        "401": { description: Authentication required }
        "403": { description: Admin access required }

  /alerts/thresholds/{code}/reset:
    post:
      operationId: resetAlertThreshold
      tags: [alerts]
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string, enum: [R1, R2, R3, R4, R5, R6, R7] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [segment]
              properties:
                segment: { type: string, enum: [PTMT, Plumbing] }
      responses:
        "200":
          description: Threshold reset
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertThresholdActionResponse" }

components:
  securitySchemes:
    apiKeyAuth:
      type: http
      scheme: bearer
      bearerFormat: API key
      description: "Managed API key with read scope and optional PTMT/Plumbing segment restrictions."
  parameters:
    ApiMonth:
      name: month
      in: query
      required: true
      schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
      description: "Fiscal month represented as YYYY-MM."
    ApiSegment:
      name: segment
      in: query
      required: false
      schema: { type: string, enum: [PTMT, Plumbing], default: PTMT }
  responses:
    V1BadRequest:
      description: Invalid month or segment.
      content: { application/json: { schema: { $ref: "#/components/schemas/V1Error" } } }
    V1Unauthorized:
      description: Missing, invalid, or revoked API key.
      content: { application/json: { schema: { $ref: "#/components/schemas/V1Error" } } }
    V1Forbidden:
      description: API key does not have the requested read or segment scope.
      content: { application/json: { schema: { $ref: "#/components/schemas/V1Error" } } }
    V1RateLimited:
      description: Per-key process-local rate limit exceeded.
      headers:
        Retry-After: { schema: { type: integer } }
        X-RateLimit-Limit: { schema: { type: integer } }
        X-RateLimit-Remaining: { schema: { type: integer } }
        X-RateLimit-Reset: { schema: { type: integer } }
      content: { application/json: { schema: { $ref: "#/components/schemas/V1Error" } } }
    V1CacheUnavailable:
      description: No safe local cache or snapshot is available.
      content: { application/json: { schema: { $ref: "#/components/schemas/V1Error" } } }
  schemas:
    V1Error:
      type: object
      required: [error, message]
      properties:
        error: { type: string }
        message: { type: string }
    V1Metadata:
      type: object
      required: [snapshotDate, lifecycle, planVersions, workingDays, workingDaysSource, elapsed, remaining, mappedProduction, unmappedProduction, cache, caveats]
      properties:
        snapshotDate: { type: ["string", "null"], format: date }
        lifecycle: { type: string, enum: [future, open, grace, closed] }
        planVersions: { type: array, items: { $ref: "#/components/schemas/V1PlanVersion" } }
        workingDays: { type: integer }
        workingDaysSource: { type: string, enum: [configured, observed, derived] }
        elapsed: { type: integer }
        remaining: { type: integer }
        mappedProduction: { type: number }
        unmappedProduction: { type: number }
        cache:
          type: object
          required: [state, ageMs, generatedAt]
          properties:
            state: { type: string, enum: [fresh, stale, frozen] }
            ageMs: { type: integer }
            generatedAt: { type: string, format: date-time }
        caveats: { type: array, items: { type: string } }
    V1PlanVersion:
      type: object
      required: [kind, sourceId, sourceLabel, effectiveFrom, effectiveTo, targetCount, selection, isCurrent]
      properties:
        kind: { type: string }
        sourceId: { type: integer }
        sourceLabel: { type: ["string", "null"] }
        effectiveFrom: { type: string, format: date }
        effectiveTo: { type: ["string", "null"], format: date }
        targetCount: { type: integer }
        selection: {}
        isCurrent: { type: boolean }
    V1PlanItem:
      type: object
      required: [itemCode, colour, category, stock, pendingOrder, avg3MoSale, pendingLastMonth, bufferReq, minProduction, productionPlan, maxProduction, releaseWeek, w1, w2, w3, w4, produced, weightKgPerPiece, machines, machineHrs]
      properties:
        itemCode: { type: string }
        colour: { type: string }
        category: { type: string }
        stock: { type: number }
        pendingOrder: { type: number }
        avg3MoSale: { type: number }
        pendingLastMonth: { type: number }
        bufferReq: { type: ["number", "null"] }
        minProduction: { type: number }
        productionPlan: { type: number }
        maxProduction: { type: number }
        releaseWeek: { type: ["integer", "null"] }
        w1: { type: number }
        w2: { type: number }
        w3: { type: number }
        w4: { type: number }
        produced: { type: number }
        weightKgPerPiece: { type: ["number", "null"] }
        machines: { type: ["array", "null"], items: { type: string } }
        machineHrs: { type: ["number", "null"] }
    V1Weekly:
      type: object
      required: [week, release, mapped, unmapped, actual]
      properties:
        week: { type: integer, minimum: 1, maximum: 4 }
        release: { type: number }
        mapped: { type: number }
        unmapped: { type: number }
        actual: { type: number }
    V1PlanItemsResponse:
      type: object
      required: [month, segment, metadata, items]
      properties:
        month: { type: string }
        segment: { type: string, enum: [PTMT, Plumbing] }
        metadata: { $ref: "#/components/schemas/V1Metadata" }
        items: { type: array, items: { $ref: "#/components/schemas/V1PlanItem" } }
    V1CalendarResponse:
      type: object
      required: [month, segment, metadata, workingDays, workingDaysSource, elapsed, remaining, workedSundays, idleWeekdays]
      properties:
        month: { type: string }
        segment: { type: string, enum: [PTMT, Plumbing] }
        metadata: { $ref: "#/components/schemas/V1Metadata" }
        workingDays: { type: integer }
        workingDaysSource: { type: string }
        elapsed: { type: integer }
        remaining: { type: integer }
        workedSundays: { type: array, items: { type: string, format: date } }
        idleWeekdays: { type: array, items: { type: string, format: date } }
    V1SummaryResponse:
      type: object
      required: [month, segment, metadata, targetMax, targetMin, mappedProduced, totalProduced, unmappedProduced, weeks]
      properties:
        month: { type: string }
        segment: { type: string, enum: [PTMT, Plumbing] }
        metadata: { $ref: "#/components/schemas/V1Metadata" }
        targetMax: { type: number }
        targetMin: { type: number }
        mappedProduced: { type: number }
        totalProduced: { type: number }
        unmappedProduced: { type: number }
        projectedAttainmentPct: { type: ["number", "null"] }
        projectedMinAttainmentPct: { type: ["number", "null"] }
        runRatePerDay: { type: ["number", "null"] }
        ragBand: { type: ["string", "null"], enum: [green, amber, red, null] }
        weeks: { type: array, items: { $ref: "#/components/schemas/V1Weekly" } }
    V1Category:
      type: object
      required: [category, targetMin, targetMax, mappedProduced, unmappedProduced, actual, gap, attainmentPct, w1, w2, w3, w4]
      properties:
        category: { type: string }
        targetMin: { type: number }
        targetMax: { type: number }
        mappedProduced: { type: number }
        unmappedProduced: { type: number }
        actual: { type: number }
        gap: { type: number }
        attainmentPct: { type: ["number", "null"] }
        w1: { $ref: "#/components/schemas/V1WeekValues" }
        w2: { $ref: "#/components/schemas/V1WeekValues" }
        w3: { $ref: "#/components/schemas/V1WeekValues" }
        w4: { $ref: "#/components/schemas/V1WeekValues" }
    V1WeekValues:
      type: object
      required: [release, mapped, unmapped, actual]
      properties:
        release: { type: number }
        mapped: { type: number }
        unmapped: { type: number }
        actual: { type: number }
    V1CategoriesResponse:
      type: object
      required: [month, segment, metadata, categories]
      properties:
        month: { type: string }
        segment: { type: string, enum: [PTMT, Plumbing] }
        metadata: { $ref: "#/components/schemas/V1Metadata" }
        categories: { type: array, items: { $ref: "#/components/schemas/V1Category" } }
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }

    UploadKind:
      type: string
      enum: [pending_orders, last_month_pending, current_stock, plumbing_fg_stock, rate_list]

    BufferCategory:
      type: object
      required: [id, name, segment, multiplier, updatedAt]
      properties:
        id: { type: integer }
        segment: { type: string }
        name: { type: string }
        multiplier: { type: number }
        updatedAt: { type: string, format: date-time }
        suggestedMultiplier: { type: ["number", "null"] }
        overrideMultiplier: { type: ["number", "null"] }
        cvValue: { type: ["number", "null"] }
        volatilityClass: { type: ["string", "null"] }
        avgMonth: { type: ["number", "null"] }
        peakMonth: { type: ["string", "null"] }
        peakIndex: { type: ["number", "null"] }
        yoy: { type: ["number", "null"] }
        signal: { type: ["string", "null"] }
        seasonalIndices: { type: ["string", "null"] }
        lastComputedAt: { type: ["string", "null"], format: date-time }
        dataQuality: { type: ["string", "null"] }
        zScore: { type: ["number", "null"] }
        reliabilityFlag: { type: ["string", "null"], description: "null=clean | 'insufficient data — override required' | 'unreliable — structural growth/launch, override recommended' | 'thin data — review'" }

    BufferCategoryUpdate:
      type: object
      properties:
        multiplier: { type: number, minimum: 0 }
        overrideMultiplier: { type: ["number", "null"], minimum: 0 }

    SeasonalityRecomputeResult:
      type: object
      required: [categories, computedAt, zScore, totalOrderQty, totalUnmappedQty, segmentBenchmark]
      properties:
        categories:
          type: array
          items:
            $ref: "#/components/schemas/BufferCategory"
        segmentBenchmark:
          $ref: "#/components/schemas/SeasonalityBenchmark"
        computedAt: { type: string, format: date-time }
        zScore: { type: number }
        totalOrderQty: { type: number }
        totalUnmappedQty: { type: number }

    SeasonalityBenchmark:
      type: object
      required: [category]
      properties:
        category: { type: string }
        avgMonth: { type: ["number", "null"] }
        cv: { type: ["number", "null"] }
        suggestedMultiplier: { type: ["number", "null"] }
        peakMonth: { type: ["string", "null"] }
        peakIndex: { type: ["number", "null"] }
        yoy: { type: ["number", "null"] }
        signal: { type: ["string", "null"] }
        dataQuality: { type: ["string", "null"] }
        volatilityClass: { type: ["string", "null"] }

    UploadedFile:
      type: object
      required: [id, kind, filename, uploadedAt, rowCount, period, sourceMetadata]
      properties:
        id: { type: integer }
        kind:
          $ref: "#/components/schemas/UploadKind"
        filename: { type: string }
        period: { type: ["string", "null"], pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
        uploadedAt: { type: string, format: date-time }
        rowCount: { type: integer }
        sourceMetadata:
          type: ["object", "null"]
          additionalProperties: true

    SyncSource:
      type: object
      required: [id, name, status, lastSyncedAt, message]
      properties:
        id: { type: string }
        name: { type: string }
        status:
          type: string
          enum: [idle, syncing, success, error]
        lastSyncedAt: { type: ["string", "null"], format: date-time }
        message: { type: ["string", "null"] }

    PlanItem:
      type: object
      required:
        - itemCode
        - colour
        - category
        - avg3MoSale
        - stock
        - bufferReq
        - minProduction
        - maxProduction
        - pendingOrderLastMonth
        - pendingOrder
        - order
        - achievementPct
        - cover
        - week
        - w1
        - w2
        - w3
        - w4
      properties:
        itemCode: { type: string }
        colour: { type: string }
        category: { type: string }
        avg3MoSale: { type: number }
        stock: { type: number }
        bufferReq: { type: ["number", "null"] }
        minProduction: { type: number }
        maxProduction: { type: number }
        pendingOrderLastMonth: { type: number }
        pendingOrder: { type: number }
        order: { type: number }
        achievementPct: { type: ["number", "null"] }
        cover:
          oneOf:
            - type: number
            - type: string
              enum: ["OS"]
        week: { type: ["integer", "null"] }
        w1: { type: number }
        w2: { type: number }
        w3: { type: number }
        w4: { type: number }
        weightKg: { type: number, description: "Total kg for this item (Plumbing only). Computed as maxProduction × weight_per_pcs from BOM sheet. 0 when noBomWeight is true. Absent for PTMT items." }
        noBomWeight: { type: boolean, description: "True when item has no BOM weight entry — must be flagged in UI, never silently dropped. Absent for PTMT items." }
        machineW1: { type: number, description: "Machine-feasible W1 quantity (Plumbing only; may differ from w1 due to capacity re-timing)." }
        machineW2: { type: number, description: "Machine-feasible W2 quantity." }
        machineW3: { type: number, description: "Machine-feasible W3 quantity." }
        machineW4: { type: number, description: "Machine-feasible W4 quantity." }
        assignedMachineId: { type: ["string", "null"], description: "Machine ID the item was assigned to; null = unconstrained (solvent, no BOM weight)." }
        machineWeek: { type: ["integer", "null"], description: "Week (1–4) the machine cascade assigned this item to; null if unfulfillable." }
        machineUnfulfillable: { type: boolean, description: "True if the item could not be scheduled in any week given machine capacity." }

    CategorySummary:
      type: object
      required: [category, minTotal, maxTotal]
      properties:
        category: { type: string }
        minTotal: { type: number }
        maxTotal: { type: number }
        demandPcs: { type: number, description: "Issued/demand quantity for the category." }
        fittedPcs: { type: ["number", "null"], description: "Executable quantity for the category; null when not scheduled." }

    PlanSummary:
      type: object
      required: [month, categories, grandMinTotal, grandMaxTotal, grandDemandTotal, grandFittedTotal, demandBasis, fittedBasis]
      properties:
        month: { type: string }
        categories:
          type: array
          items:
            $ref: "#/components/schemas/CategorySummary"
        grandMinTotal: { type: number }
        grandMaxTotal: { type: number, description: "Compatibility alias for the issued demand total." }
        grandDemandTotal: { type: number, description: "Issued/demand quantity owed by the plan." }
        grandFittedTotal: { type: ["number", "null"], description: "Executable quantity from the finalized Production run; null when only a Temporary run exists." }
        demandBasis: { type: string, enum: [demand] }
        fittedBasis: { type: ["string", "null"], enum: [executable, null] }
        inputProvenance:
          $ref: "#/components/schemas/PlanInputProvenance"

    AvailableMonthsResponse:
      type: object
      required: [months]
      properties:
        months:
          type: array
          items:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])$'
          description: Calendar months with a plan run or immutable plant snapshot, sorted newest first.

    PlanInputProvenance:
      type: object
      additionalProperties:
        $ref: "#/components/schemas/PlanInputProvenanceEntry"

    PlanInputProvenanceEntry:
      type: object
      required: [source, mode]
      properties:
        source: { type: string }
        mode: { type: string, enum: [upload, live, frozen, not-used] }
        uploadId: { type: integer }
        filename: { type: string }
        capturedAt: { type: string, format: date-time }

    CreatePlanRunRequest:
      type: object
      required: [month]
      properties:
        month: { type: string }
        segment: { type: string }
        planType:
          type: string
          enum: [temporary, production]
          default: production
          description: Temporary is demand-true and never issued to the floor; production is the machine-feasible lineage.
        temporaryRunId:
          type: ["integer", "null"]
          description: Temporary Plan that this Production Plan was fitted from.
        note: { type: string }
        effectiveFrom:
          type: string
          format: date
          description: Date within the plan month when this issued version begins governing monitoring.

    FinalizePlanRunRequest:
      type: object
      properties:
        effectiveFrom:
          type: string
          format: date
          description: Optional final effective date for this issued plan version.

    PlanRunSummary:
      type: object
      required: [id, month, segment, planType, temporaryRunId, asOfAt, status, effectiveFrom, note, planStatusReason, pass2, itemCount, grandMinTotal, grandMaxTotal, grandDemandTotal, grandFittedTotal, demandBasis, fittedBasis, createdAt]
      properties:
        id: { type: integer }
        month: { type: string }
        segment: { type: string }
        planType: { type: string, enum: [temporary, production] }
        temporaryRunId: { type: ["integer", "null"] }
        asOfAt: { type: string, format: date-time }
        status: { type: string, enum: [draft, finalized] }
        effectiveFrom:
          type: ["string", "null"]
          format: date
          description: Date this issued plan version begins governing monitoring; null only for legacy runs.
        note: { type: ["string", "null"] }
        planStatusReason:
          type: ["string", "null"]
          description: Audit reason when the issued plan has a known provenance or status concern.
        pass2:
          allOf:
            - $ref: "#/components/schemas/PlanRunPass2Audit"
          nullable: true
        itemCount: { type: integer }
        grandMinTotal: { type: number }
        grandMaxTotal: { type: number, description: "Compatibility alias for the issued demand total." }
        grandDemandTotal: { type: number, description: "Issued/demand quantity owed by the plan." }
        grandFittedTotal: { type: ["number", "null"], description: "Executable quantity; null for demand-only Temporary Plans." }
        demandBasis: { type: string, enum: [demand] }
        fittedBasis: { type: ["string", "null"], enum: [executable, null] }
        createdAt: { type: string, format: date-time }

    PlanRunItem:
      type: object
      required: [itemCode, colour, category, avg3MoSale, stock, pendingCurrent, pendingLastMonth, bufferReq, minProduction, demandPlan, productionPlan, temporaryPlan, cannotBeMade, feasibilityStatus, dummy, orders, buffer]
      properties:
        itemCode: { type: string }
        colour: { type: string }
        category: { type: string }
        avg3MoSale: { type: number }
        stock: { type: number }
        pendingCurrent: { type: number }
        pendingLastMonth: { type: number }
        bufferReq: { type: ["number", "null"] }
        minProduction: { type: number }
        demandPlan: { type: number, description: "Frozen demand/owed quantity before machine fitting." }
        productionPlan: { type: number, description: "Executable quantity for a fitted Production Plan; demand quantity for a Temporary Plan." }
        temporaryPlan: { type: number, description: "Frozen Temporary Plan demand before PTMT capacity fitting." }
        cannotBeMade: { type: number, description: "Temporary demand remaining after all four weekly category capacities are consumed." }
        feasibilityStatus: { type: string, enum: [fitted, not-scheduled, unfulfillable] }
        dummy: { type: number }
        orders: { type: number }
        buffer: { type: number }
        material: { type: ["string", "null"] }
        weightKg: { type: ["number", "null"] }
        urgencyRank: { type: ["integer", "null"] }
        releaseWeek: { type: ["integer", "null"] }
        w1: { type: number }
        w2: { type: number }
        w3: { type: number }
        w4: { type: number }

    PlanRunPass2Audit:
      type: object
      required: [workingDays, workedSundayDates, categories, invariants]
      properties:
        workingDays: { type: integer }
        workedSundayDates:
          type: array
          items: { type: string, format: date }
        categories:
          type: array
          items:
            type: object
            required: [category, fullP90, recent90dP90, driftPct, selectedWindow, selectedP90, overrideCapacity, capacityPerDay, workingDays, weeklyCapacity, weeklyRelease, temporaryPlan, productionPlan, cannotBeMade]
            properties:
              category: { type: string }
              fullP90: { type: number }
              recent90dP90: { type: number }
              driftPct: { type: ["number", "null"] }
              recoveryDriftPct: { type: ["number", "null"], description: "Recovery drift from the minimum positive monthly p90 to the latest positive monthly p90" }
              monthlyP90CvPct: { type: ["number", "null"], description: "Population coefficient of variation across positive monthly p90s, expressed as a percentage; high values mean neither window is reliable alone" }
              latestMonthlyP90: { type: ["number", "null"] }
              minPositiveMonthlyP90: { type: ["number", "null"] }
              zeroProductionMonths:
                type: array
                items: { type: string }
                description: "Months with no positive-production observations; not capacity zeros"
