openapi: 3.1.0
info:
  title: Api
  version: 1.0.0
servers:
  - url: /api
paths:
  /healthz:
    get:
      operationId: getHealthz
      tags: [system]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /buffer-categories:
    get:
      operationId: listBufferCategories
      tags: [bufferCategories]
      parameters:
        - name: segment
          in: query
          required: false
          schema: { type: string, default: "PTMT" }
          description: "Filter by segment: PTMT or Plumbing"
      responses:
        "200":
          description: List of buffer categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BufferCategory"

  /buffer-categories/{id}:
    patch:
      operationId: updateBufferCategory
      tags: [bufferCategories]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BufferCategoryUpdate"
      responses:
        "200":
          description: Updated buffer category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BufferCategory"
        "404":
          description: Not found

  /buffer-categories/recompute:
    post:
      operationId: recomputeSeasonality
      tags: [bufferCategories]
      summary: Recompute seasonality engine for all PTMT categories
      parameters:
        - name: z
          in: query
          required: false
          schema: { type: number, default: 1.65 }
          description: "z-score for service level (1.28=90%, 1.65=95%, 2.05=98%)"
        - name: segment
          in: query
          required: false
          schema: { type: string, default: "PTMT" }
      responses:
        "200":
          description: Recompute triggered; returns updated categories
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeasonalityRecomputeResult"
        "500":
          description: Engine error

  /uploads:
    get:
      operationId: listUploads
      tags: [uploads]
      responses:
        "200":
          description: List of uploaded source files
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UploadedFile"

  /uploads/{kind}:
    post:
      operationId: createUpload
      tags: [uploads]
      parameters:
        - name: kind
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UploadKind"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Uploaded file processed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadedFile"
        "400":
          description: Invalid file

  /sync/sheets:
    post:
      operationId: syncSheets
      tags: [sync]
      responses:
        "200":
          description: Sync results per source
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SyncSource"

  /sync/status:
    get:
      operationId: getSyncStatus
      tags: [sync]
      responses:
        "200":
          description: Current status of each live sheet source
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SyncSource"

  /corrective/replan:
    post:
      operationId: runCorrectiveReplan
      tags: [corrective]
      summary: Run the weekly corrective re-plan engine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CorrectiveReplanInput"
      responses:
        "200":
          description: Corrective re-plan result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CorrectiveReplanResult"
        "400":
          description: Bad request
        "500":
          description: Engine error

  /corrective/runs:
    get:
      operationId: listCorrectiveRuns
      tags: [corrective]
      parameters:
        - name: month
          in: query
          required: false
          schema: { type: string }
        - name: segment
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: List of corrective plan runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CorrectivePlanRunSummary"

  /corrective/runs/{id}:
    get:
      operationId: getCorrectiveRun
      tags: [corrective]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Full corrective run with items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CorrectiveReplanResult"
        "404":
          description: Not found

  /corrective/runs/{id}/export/excel:
    get:
      operationId: exportCorrectiveExcel
      tags: [corrective]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Excel workbook
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        "404":
          description: Not found

  /corrective/runs/{id}/export/pdf:
    get:
      operationId: exportCorrectivePdf
      tags: [corrective]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: PDF report
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "404":
          description: Not found

  /corrective/export/excel:
    get:
      operationId: exportLatestCorrectiveExcel
      tags: [corrective]
      parameters:
        - name: month
          in: query
          required: true
          schema: { type: string }
        - name: segment
          in: query
          required: false
          schema: { type: string, default: "PTMT" }
      responses:
        "200":
          description: Excel workbook for latest corrective run
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        "404":
          description: No corrective run found for month/segment

  /corrective/export/pdf:
    get:
      operationId: exportLatestCorrectivePdf
      tags: [corrective]
      parameters:
        - name: month
          in: query
          required: true
          schema: { type: string }
        - name: segment
          in: query
          required: false
          schema: { type: string, default: "PTMT" }
      responses:
        "200":
          description: PDF report for latest corrective run
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "404":
          description: No corrective run found for month/segment

  /capacity/categories:
    get:
      operationId: listCategoryCapacities
      tags: [capacity]
      parameters:
        - name: segment
          in: query
          required: false
          schema: { type: string, default: "PTMT" }
          description: "Filter by segment: PTMT or Plumbing"
      responses:
        "200":
          description: List of per-category production capacities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CategoryCapacity"

  /capacity/categories/{category}:
    patch:
      operationId: updateCategoryCapacity
      tags: [capacity]
      parameters:
        - name: category
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryCapacityUpdate"
      responses:
        "200":
          description: Updated category capacity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryCapacity"
        "404":
          description: Not found

  /capacity/recompute:
    post:
      operationId: recomputeCategoryCapacity
      tags: [capacity]
      summary: Recompute per-category capacity from trailing actuals
      parameters:
        - name: trailingDays
          in: query
          required: false
          schema: { type: integer, default: 90 }
        - name: segment
          in: query
          required: false
          schema: { type: string, default: "PTMT" }
          description: "Segment to recompute: PTMT or Plumbing"
      responses:
        "200":
          description: Recomputed category capacities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CategoryCapacity"
        "500":
          description: Engine error

  /capacity/machines:
    get:
      operationId: listPlumbingMachines
      tags: [capacity]
      parameters:
        - name: segment
          in: query
          required: false
          schema: { type: string, default: "Plumbing" }
          description: "Segment (Plumbing)"
        - name: month
          in: query
          required: false
          schema: { type: string }
          description: "YYYY-MM — if provided, includes per-machine utilisation"
      responses:
        "200":
          description: Machine configs with optional per-week utilisation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MachineCapacityResponse"
        "500":
          description: Server error

  /capacity/machines/{machineId}:
    put:
      operationId: updatePlumbingMachine
      tags: [capacity]
      parameters:
        - name: machineId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlumbingMachineUpdate"
      responses:
        "200":
          description: Updated machine
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlumbingMachine"
        "404":
          description: Not found

  /plan:
    get:
      operationId: listPlanItems
      tags: [plan]
      parameters:
        - name: month
          in: query
          required: true
          schema: { type: string }
        - name: segment
          in: query
          required: false
          schema: { type: string, default: "PTMT" }
        - name: category
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Computed production plan line items for the month
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlanItem"

  /plan/summary:
    get:
      operationId: getPlanSummary
      tags: [plan]
      parameters:
        - name: month
          in: query
          required: true
          schema: { type: string }
        - name: segment
          in: query
          required: false
          schema: { type: string, default: "PTMT" }
      responses:
        "200":
          description: Per-category and grand totals for the month
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanSummary"

  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      responses:
        "200":
          description: Top-level dashboard snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSnapshot"

  /plan/export/excel:
    get:
      operationId: exportPlanExcel
      tags: [plan]
      parameters:
        - name: month
          in: query
          required: true
          schema: { type: string }
        - name: segment
          in: query
          required: false
          schema: { type: string, default: "PTMT" }
      responses:
        "200":
          description: Excel workbook of the production plan
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary

  /plan/export/pdf:
    get:
      operationId: exportPlanPdf
      tags: [plan]
      parameters:
        - name: month
          in: query
          required: true
          schema: { type: string }
        - name: segment
          in: query
          required: false
          schema: { type: string, default: "PTMT" }
      responses:
        "200":
          description: PDF report of the production plan
          content:
            application/pdf:
              schema:
                type: string
                format: binary

  /plan/export/weekly-excel:
    get:
      operationId: exportWeeklyReleaseExcel
      tags: [plan]
      parameters:
        - name: month
          in: query
          required: true
          schema: { type: string }
        - name: segment
          in: query
          required: false
          schema: { type: string, default: "PTMT" }
      responses:
        "200":
          description: Excel workbook of the weekly release plan
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary

  /plan/bom-quality:
    get:
      operationId: getPlumbingBomQuality
      tags: [plan]
      description: "Data-quality report: lists Plumbing plan items with no BOM weight entry (~3% of planned pcs). These show 0 kg and must be flagged in UI."
      parameters:
        - name: month
          in: query
          required: true
          schema: { type: string }
        - name: segment
          in: query
          required: false
          schema: { type: string, default: "Plumbing" }
      responses:
        "200":
          description: BOM data-quality report
          content:
            application/json:
              schema:
                type: object
                required: [segment, month, totalItems, missingBomItems, missingPcs, totalPcs, missingPct]
                properties:
                  segment: { type: string }
                  month: { type: string }
                  totalItems: { type: integer }
                  missingBomItems:
                    type: array
                    items:
                      type: object
                      required: [itemCode, colour, category, pcs]
                      properties:
                        itemCode: { type: string }
                        colour: { type: string }
                        category: { type: string }
                        pcs: { type: number }
                  missingPcs: { type: integer }
                  totalPcs: { type: integer }
                  missingPct: { type: number, description: "Percentage of total pcs with no BOM weight" }

  /plan/weekly-bands:
    get:
      operationId: listWeeklyReleaseBands
      tags: [plan]
      parameters:
        - name: segment
          in: query
          required: false
          schema: { type: string, default: "PTMT" }
      responses:
        "200":
          description: Weekly release band configs per category
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WeeklyReleaseBand"

  /plan/weekly-bands/{category}:
    put:
      operationId: updateWeeklyReleaseBand
      tags: [plan]
      parameters:
        - name: category
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WeeklyReleaseBandUpdate"
      responses:
        "200":
          description: Updated weekly release band config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeeklyReleaseBand"
        "400":
          description: Validation error
        "404":
          description: Category not found

  /plan/runs:
    post:
      operationId: createPlanRun
      tags: [plan]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePlanRunRequest"
      responses:
        "201":
          description: Draft plan run created with frozen snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanRunSummary"
        "400":
          description: Bad request
    get:
      operationId: listPlanRuns
      tags: [plan]
      parameters:
        - name: month
          in: query
          required: true
          schema: { type: string }
        - name: segment
          in: query
          required: false
          schema: { type: string, default: "PTMT" }
      responses:
        "200":
          description: List of plan runs for the month, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlanRunSummary"

  /plan/runs/compare:
    get:
      operationId: comparePlanRuns
      tags: [plan]
      parameters:
        - name: run1
          in: query
          required: true
          schema: { type: integer }
        - name: run2
          in: query
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Per-item delta between two frozen runs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanRunDiff"

  /plan/runs/{id}:
    get:
      operationId: getPlanRun
      tags: [plan]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Frozen plan run with all per-item results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanRunDetail"
        "404":
          description: Not found
    delete:
      operationId: deletePlanRun
      tags: [plan]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Run deleted
        "404":
          description: Not found

  /plan/runs/{id}/drift:
    get:
      operationId: getPlanRunDrift
      tags: [plan]
      summary: Frozen "as issued" plan vs live rebuild "if re-run today"
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Drift between the frozen run and a live rebuild
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanRunDrift"
        "404":
          description: Not found
        "422":
          description: Live rebuild failed (missing/broken upload)

  /plan/runs/{id}/finalize:
    post:
      operationId: finalizePlanRun
      tags: [plan]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Run finalized (locked)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanRunSummary"
        "404":
          description: Not found

  /monitoring/dashboard:
    get:
      operationId: getMonitoringDashboard
      tags: [monitoring]
      parameters:
        - name: month
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Monitoring top-level snapshot for the month
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitoringDashboard"

  /monitoring/velocity:
    get:
      operationId: getMonitoringVelocity
      tags: [monitoring]
      parameters:
        - name: month
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Plant and per-category pace/attainment metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitoringVelocity"

  /monitoring/warnings:
    get:
      operationId: getMonitoringWarnings
      tags: [monitoring]
      parameters:
        - name: month
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Ranked list of warnings for the month
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitoringWarnings"

  /monitoring/actions:
    get:
      operationId: getMonitoringActions
      tags: [monitoring]
      parameters:
        - name: month
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Recommended actions for the month
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitoringActions"

  /monitoring/quality:
    get:
      operationId: getMonitoringQuality
      tags: [monitoring]
      parameters:
        - name: month
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Per-machine utilisation/rejection quality data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitoringQuality"

  /monitoring/backlog:
    get:
      operationId: getMonitoringBacklog
      tags: [monitoring]
      parameters:
        - name: month
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Items where stock is below pending orders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitoringBacklog"

  /monitoring/export/excel:
    get:
      operationId: exportMonitoringExcel
      tags: [monitoring]
      parameters:
        - name: month
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Excel workbook of the monitoring snapshot
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary

  /monitoring/export/pdf:
    get:
      operationId: exportMonitoringPdf
      tags: [monitoring]
      parameters:
        - name: month
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: PDF report of the monitoring snapshot
          content:
            application/pdf:
              schema:
                type: string
                format: binary

  /monitoring/weights:
    get:
      operationId: listItemWeights
      tags: [monitoring]
      responses:
        "200":
          description: All configured item weights
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ItemWeight"
    put:
      operationId: upsertItemWeight
      tags: [monitoring]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemWeightUpsert"
      responses:
        "200":
          description: Weight saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResult"

  /monitoring/ideal-hours-overrides:
    get:
      operationId: listIdealHoursOverrides
      tags: [monitoring]
      parameters:
        - name: month
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Ideal-hours overrides
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IdealHoursOverride"
    put:
      operationId: upsertIdealHoursOverride
      tags: [monitoring]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdealHoursOverrideUpsert"
      responses:
        "200":
          description: Override saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResult"

  /monitoring/thresholds:
    get:
      operationId: getMonitoringThresholds
      tags: [monitoring]
      responses:
        "200":
          description: Current warning thresholds
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WarningThresholds"
    put:
      operationId: updateMonitoringThresholds
      tags: [monitoring]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WarningThresholds"
      responses:
        "200":
          description: Thresholds saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResult"

  /monitoring/config:
    get:
      operationId: getMonitoringConfig
      tags: [monitoring]
      parameters:
        - name: month
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Calendar/config settings for the month
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitoringConfig"
    put:
      operationId: updateMonitoringConfig
      tags: [monitoring]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MonitoringConfigUpdate"
      responses:
        "200":
          description: Config saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResult"

  /ai/analyses:
    get:
      operationId: listAiAnalyses
      tags: [ai]
      parameters:
        - name: month
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: History of AI analyses for the month
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AiAnalysisSummary"

  /ai/analyses/{id}:
    get:
      operationId: getAiAnalysis
      tags: [ai]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: A single AI analysis with its follow-up messages
          content:
