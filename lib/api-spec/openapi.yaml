openapi: 3.1.0
info:
  title: Api
  version: 1.0.0
servers:
  - url: /api
paths:
  /healthz:
    get:
      operationId: getHealthz
      tags: [system]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /buffer-categories:
    get:
      operationId: listBufferCategories
      tags: [bufferCategories]
      responses:
        "200":
          description: List of buffer categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BufferCategory"

  /buffer-categories/{id}:
    patch:
      operationId: updateBufferCategory
      tags: [bufferCategories]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BufferCategoryUpdate"
      responses:
        "200":
          description: Updated buffer category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BufferCategory"
        "404":
          description: Not found

  /uploads:
    get:
      operationId: listUploads
      tags: [uploads]
      responses:
        "200":
          description: List of uploaded source files
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UploadedFile"

  /uploads/{kind}:
    post:
      operationId: createUpload
      tags: [uploads]
      parameters:
        - name: kind
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UploadKind"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Uploaded file processed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadedFile"
        "400":
          description: Invalid file

  /sync/sheets:
    post:
      operationId: syncSheets
      tags: [sync]
      responses:
        "200":
          description: Sync results per source
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SyncSource"

  /sync/status:
    get:
      operationId: getSyncStatus
      tags: [sync]
      responses:
        "200":
          description: Current status of each live sheet source
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SyncSource"

  /plan:
    get:
      operationId: listPlanItems
      tags: [plan]
      parameters:
        - name: month
          in: query
          required: true
          schema: { type: string }
        - name: category
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Computed production plan line items for the month
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlanItem"

  /plan/summary:
    get:
      operationId: getPlanSummary
      tags: [plan]
      parameters:
        - name: month
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Per-category and grand totals for the month
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanSummary"

  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      responses:
        "200":
          description: Top-level dashboard snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSnapshot"

  /plan/export/excel:
    get:
      operationId: exportPlanExcel
      tags: [plan]
      parameters:
        - name: month
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Excel workbook of the production plan
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary

  /plan/export/pdf:
    get:
      operationId: exportPlanPdf
      tags: [plan]
      parameters:
        - name: month
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: PDF report of the production plan
          content:
            application/pdf:
              schema:
                type: string
                format: binary

  /plan/export/weekly-excel:
    get:
      operationId: exportWeeklyReleaseExcel
      tags: [plan]
      parameters:
        - name: month
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Excel workbook of the weekly release plan
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary

  /plan/weekly-bands:
    get:
      operationId: listWeeklyReleaseBands
      tags: [plan]
      responses:
        "200":
          description: Weekly release band configs per category
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WeeklyReleaseBand"

  /plan/weekly-bands/{category}:
    put:
      operationId: updateWeeklyReleaseBand
      tags: [plan]
      parameters:
        - name: category
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WeeklyReleaseBandUpdate"
      responses:
        "200":
          description: Updated weekly release band config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeeklyReleaseBand"
        "400":
          description: Validation error
        "404":
          description: Category not found

  /plan/runs:
    post:
      operationId: createPlanRun
      tags: [plan]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePlanRunRequest"
      responses:
        "201":
          description: Draft plan run created with frozen snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanRunSummary"
        "400":
          description: Bad request
    get:
      operationId: listPlanRuns
      tags: [plan]
      parameters:
        - name: month
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: List of plan runs for the month, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlanRunSummary"

  /plan/runs/compare:
    get:
      operationId: comparePlanRuns
      tags: [plan]
      parameters:
        - name: run1
          in: query
          required: true
          schema: { type: integer }
        - name: run2
          in: query
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Per-item delta between two frozen runs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanRunDiff"

  /plan/runs/{id}:
    get:
      operationId: getPlanRun
      tags: [plan]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Frozen plan run with all per-item results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanRunDetail"
        "404":
          description: Not found

  /plan/runs/{id}/finalize:
    post:
      operationId: finalizePlanRun
      tags: [plan]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Run finalized (locked)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanRunSummary"
        "404":
          description: Not found

  /monitoring/dashboard:
    get:
      operationId: getMonitoringDashboard
      tags: [monitoring]
      parameters:
        - name: month
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Monitoring top-level snapshot for the month
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitoringDashboard"

  /monitoring/velocity:
    get:
      operationId: getMonitoringVelocity
      tags: [monitoring]
      parameters:
        - name: month
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Plant and per-category pace/attainment metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitoringVelocity"

  /monitoring/warnings:
    get:
      operationId: getMonitoringWarnings
      tags: [monitoring]
      parameters:
        - name: month
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Ranked list of warnings for the month
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitoringWarnings"

  /monitoring/actions:
    get:
      operationId: getMonitoringActions
      tags: [monitoring]
      parameters:
        - name: month
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Recommended actions for the month
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitoringActions"

  /monitoring/quality:
    get:
      operationId: getMonitoringQuality
      tags: [monitoring]
      parameters:
        - name: month
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Per-machine utilisation/rejection quality data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitoringQuality"

  /monitoring/backlog:
    get:
      operationId: getMonitoringBacklog
      tags: [monitoring]
      parameters:
        - name: month
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Items where stock is below pending orders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitoringBacklog"

  /monitoring/export/excel:
    get:
      operationId: exportMonitoringExcel
      tags: [monitoring]
      parameters:
        - name: month
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Excel workbook of the monitoring snapshot
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary

  /monitoring/export/pdf:
    get:
      operationId: exportMonitoringPdf
      tags: [monitoring]
      parameters:
        - name: month
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: PDF report of the monitoring snapshot
          content:
            application/pdf:
              schema:
                type: string
                format: binary

  /monitoring/weights:
    get:
      operationId: listItemWeights
      tags: [monitoring]
      responses:
        "200":
          description: All configured item weights
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ItemWeight"
    put:
      operationId: upsertItemWeight
      tags: [monitoring]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemWeightUpsert"
      responses:
        "200":
          description: Weight saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResult"

  /monitoring/ideal-hours-overrides:
    get:
      operationId: listIdealHoursOverrides
      tags: [monitoring]
      parameters:
        - name: month
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Ideal-hours overrides
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IdealHoursOverride"
    put:
      operationId: upsertIdealHoursOverride
      tags: [monitoring]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdealHoursOverrideUpsert"
      responses:
        "200":
          description: Override saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResult"

  /monitoring/thresholds:
    get:
      operationId: getMonitoringThresholds
      tags: [monitoring]
      responses:
        "200":
          description: Current warning thresholds
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WarningThresholds"
    put:
      operationId: updateMonitoringThresholds
      tags: [monitoring]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WarningThresholds"
      responses:
        "200":
          description: Thresholds saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResult"

  /monitoring/config:
    get:
      operationId: getMonitoringConfig
      tags: [monitoring]
      parameters:
        - name: month
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Calendar/config settings for the month
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitoringConfig"
    put:
      operationId: updateMonitoringConfig
      tags: [monitoring]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MonitoringConfigUpdate"
      responses:
        "200":
          description: Config saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResult"

  /ai/analyses:
    get:
      operationId: listAiAnalyses
      tags: [ai]
      parameters:
        - name: month
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: History of AI analyses for the month
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AiAnalysisSummary"

  /ai/analyses/{id}:
    get:
      operationId: getAiAnalysis
      tags: [ai]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: A single AI analysis with its follow-up messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiAnalysisDetail"

  /ai/analyses/{id}/export/pdf:
    get:
      operationId: exportAiAnalysisPdf
      tags: [ai]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: PDF export of the AI analysis
          content:
            application/pdf:
              schema:
                type: string
                format: binary

  /ai/analyze-plant:
    post:
      operationId: analyzeAiPlant
      tags: [ai]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [month]
              properties:
                month: { type: string }
                depth: { type: string, enum: [standard, deep] }
      responses:
        "200":
          description: SSE stream of Claude analysis chunks
          content:
            text/event-stream:
              schema:
                type: string

  /ai/plant-analyses:
    get:
      operationId: listAiPlantAnalyses
      tags: [ai]
      parameters:
        - name: month
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: History of plant AI analyses for the month
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AiAnalysisSummary"

  /ai/plant-analyses/{id}:
    get:
      operationId: getAiPlantAnalysis
      tags: [ai]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: A single plant AI analysis with its follow-up messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiPlantAnalysisDetail"

  /ai/plant-analyses/{id}/followup:
    post:
      operationId: followupAiPlantAnalysis
      tags: [ai]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question: { type: string }
      responses:
        "200":
          description: SSE stream of Claude follow-up response
          content:
            text/event-stream:
              schema:
                type: string

  /ai/plant-analyses/{id}/export/pdf:
    get:
      operationId: exportAiPlantAnalysisPdf
      tags: [ai]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: PDF export of the plant AI analysis
          content:
            application/pdf:
              schema:
                type: string
                format: binary

  /plant/bundle:
    get:
      operationId: getPlantBundle
      tags: [plant]
      parameters:
        - name: month
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Full plant-level production bundle for the month
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlantBundle"

  /plant/config:
    get:
      operationId: getPlantConfig
      tags: [plant]
      parameters:
        - name: month
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Plant configuration for the month
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlantConfigData"
    put:
      operationId: updatePlantConfig
      tags: [plant]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlantConfigUpdate"
      responses:
        "200":
          description: Config saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResult"
    patch:
      operationId: patchPlantConfig
      tags: [plant]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlantConfigUpdate"
      responses:
        "200":
          description: Config patched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResult"

  /plant/source-config:
    put:
      operationId: upsertPlantSourceConfig
      tags: [plant]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlantSourceConfigUpsert"
      responses:
        "200":
          description: Source config saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResult"

  /plant/cache/invalidate:
    post:
      operationId: invalidatePlantCache
      tags: [plant]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [month]
              properties:
                month: { type: string }
      responses:
        "200":
          description: Cache cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResult"

  /plant/trend:
    get:
      operationId: getPlantTrend
      tags: [plant]
      parameters:
        - name: months
          in: query
          required: false
          schema: { type: string }
          description: "Optional filter: a number (e.g. '6' = last 6 months) or comma-separated YYYY-MM list"
      responses:
        "200":
          description: Month-over-month plant trend summaries
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/PlantTrendSummary"

  /plant/export/pdf:
    get:
      operationId: exportPlantPdf
      tags: [plant]
      parameters:
        - name: month
          in: query
          required: true
          schema: { type: string }
        - name: section
          in: query
          required: false
          schema:
            type: string
            enum: [control-board, velocity, warnings]
            default: control-board
      responses:
        "200":
          description: PDF export of the plant report
          content:
            application/pdf:
              schema:
                type: string
                format: binary

  /plant/weekly-summary:
    get:
      operationId: getPlantWeeklySummary
      tags: [plant]
      summary: Weekly release plan vs actuals for a month
      parameters:
        - name: month
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Weekly release summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlantWeeklySummary"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }

    UploadKind:
      type: string
      enum: [pending_orders, last_month_pending, current_stock]

    BufferCategory:
      type: object
      required: [id, name, multiplier, updatedAt]
      properties:
        id: { type: integer }
        name: { type: string }
        multiplier: { type: number }
        updatedAt: { type: string, format: date-time }

    BufferCategoryUpdate:
      type: object
      required: [multiplier]
      properties:
        multiplier: { type: number, minimum: 0 }

    UploadedFile:
      type: object
      required: [id, kind, filename, uploadedAt, rowCount]
      properties:
        id: { type: integer }
        kind:
          $ref: "#/components/schemas/UploadKind"
        filename: { type: string }
        uploadedAt: { type: string, format: date-time }
        rowCount: { type: integer }

    SyncSource:
      type: object
      required: [id, name, status, lastSyncedAt, message]
      properties:
        id: { type: string }
        name: { type: string }
        status:
          type: string
          enum: [idle, syncing, success, error]
        lastSyncedAt: { type: ["string", "null"], format: date-time }
        message: { type: ["string", "null"] }

    PlanItem:
      type: object
      required:
        - itemCode
        - colour
        - category
        - avg3MoSale
        - stock
        - bufferReq
        - minProduction
        - maxProduction
        - pendingOrderLastMonth
        - pendingOrder
        - order
        - achievementPct
        - cover
        - week
        - w1
        - w2
        - w3
        - w4
      properties:
        itemCode: { type: string }
        colour: { type: string }
        category: { type: string }
        avg3MoSale: { type: number }
        stock: { type: number }
        bufferReq: { type: number }
        minProduction: { type: number }
        maxProduction: { type: number }
        pendingOrderLastMonth: { type: number }
        pendingOrder: { type: number }
        order: { type: number }
        achievementPct: { type: ["number", "null"] }
        cover:
          oneOf:
            - type: number
            - type: string
              enum: ["OS"]
        week: { type: ["integer", "null"] }
        w1: { type: number }
        w2: { type: number }
        w3: { type: number }
        w4: { type: number }

    CategorySummary:
      type: object
      required: [category, minTotal, maxTotal]
      properties:
        category: { type: string }
        minTotal: { type: number }
        maxTotal: { type: number }

    PlanSummary:
      type: object
      required: [month, categories, grandMinTotal, grandMaxTotal]
      properties:
        month: { type: string }
        categories:
          type: array
          items:
            $ref: "#/components/schemas/CategorySummary"
        grandMinTotal: { type: number }
        grandMaxTotal: { type: number }

    CreatePlanRunRequest:
      type: object
      required: [month]
      properties:
        month: { type: string }
        note: { type: string }

    PlanRunSummary:
      type: object
      required: [id, month, asOfAt, status, note, itemCount, grandMinTotal, grandMaxTotal, createdAt]
      properties:
        id: { type: integer }
        month: { type: string }
        asOfAt: { type: string, format: date-time }
        status: { type: string, enum: [draft, finalized] }
        note: { type: ["string", "null"] }
