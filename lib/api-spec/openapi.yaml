  /api-keys:
    get:
      operationId: listApiKeys
      tags: [apiKeys]
      summary: List all API keys (hashes never returned)
      responses:
        "200":
          description: List of API keys
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiKey"
    post:
      operationId: createApiKey
      tags: [apiKeys]
      summary: Create a new API key — returns the full key exactly once
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApiKeyRequest"
      responses:
        "201":
          description: Created — includes full key (shown once only)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyWithSecret"
        "400":
          description: Validation error

  /api-keys/{id}:
    delete:
      operationId: deleteApiKey
      tags: [apiKeys]
      summary: Permanently delete an API key
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        "404":
          description: Not found

  /api-keys/{id}/regenerate:
    post:
      operationId: regenerateApiKey
      tags: [apiKeys]
      summary: Regenerate — issues a new secret, old key stops working immediately
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: New key issued — shown once only
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyWithSecret"
        "404":
          description: Not found

  /plant-live/plants:
    get:
      operationId: getPlantLivePlants
      tags: [plantLive]
      summary: List all plants from prayag-plant.com live API
      responses:
        "200":
          description: Plant list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlantLivePlantsResponse"

  /plant-live/periods:
    get:
      operationId: getPlantLivePeriods
      tags: [plantLive]
      summary: Valid period tokens and months holding data from prayag-plant.com live API
      responses:
        "200":
          description: Period tokens and months with data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlantLivePeriodsResponse"
        "502":
          description: Upstream API unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlantLiveError"
        "503":
          description: PRAYAG_PLANT_API_KEY not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlantLiveError"

  /plant-live/records:
    get:
      operationId: getPlantLiveRecords
      tags: [plantLive]
      summary: Raw row-level production data with provenance from prayag-plant.com live API
      parameters:
        - name: period
          in: query
          required: false
          schema: { type: string, default: "last_updated" }
          description: "Period token e.g. last_updated, last_month, 2026-07"
        - name: plant
          in: query
          required: false
          schema: { type: string }
          description: "Plant code e.g. PTMT, PIPE, GARDEN"
        - name: segment
          in: query
          required: false
          schema: { type: string }
          description: "Segment filter"
        - name: machine
          in: query
          required: false
          schema: { type: string }
          description: "Machine filter"
      responses:
        "200":
          description: Row-level records with confirmation status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlantLiveRecordsResponse"
        "401":
          description: Missing or invalid managed API key (Authorization Bearer)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlantLiveError"
        "502":
          description: Upstream API unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlantLiveError"
        "503":
          description: PRAYAG_PLANT_API_KEY not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlantLiveError"

  /plant-live/summary:
    get:
      operationId: getPlantLiveSummary
      tags: [plantLive]
      summary: Machine-level performance summary from prayag-plant.com live API
      parameters:
        - name: period
          in: query
          required: false
          schema: { type: string, default: "last_updated" }
          description: "Period token e.g. last_updated, last_month, 2026-07"
        - name: plant
          in: query
          required: false
          schema: { type: string }
          description: "Plant code e.g. PTMT, PIPE, GARDEN"
        - name: segment
          in: query
          required: false
          schema: { type: string }
          description: "Segment filter"
        - name: machine
          in: query
          required: false
          schema: { type: string }
          description: "Machine filter"
      responses:
        "200":
          description: Summary with by_machine and by_date breakdowns
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlantLiveSummaryResponse"
        "502":
          description: Upstream API unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlantLiveError"
        "503":
          description: PRAYAG_PLANT_API_KEY not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlantLiveError"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }

    UploadKind:
      type: string
      enum: [pending_orders, last_month_pending, current_stock, plumbing_fg_stock]

    BufferCategory:
      type: object
      required: [id, name, segment, multiplier, updatedAt]
      properties:
        id: { type: integer }
        segment: { type: string }
        name: { type: string }
        multiplier: { type: number }
        updatedAt: { type: string, format: date-time }
        suggestedMultiplier: { type: ["number", "null"] }
        overrideMultiplier: { type: ["number", "null"] }
        cvValue: { type: ["number", "null"] }
        volatilityClass: { type: ["string", "null"] }
        avgMonth: { type: ["number", "null"] }
        peakMonth: { type: ["string", "null"] }
        peakIndex: { type: ["number", "null"] }
        yoy: { type: ["number", "null"] }
        signal: { type: ["string", "null"] }
        seasonalIndices: { type: ["string", "null"] }
        lastComputedAt: { type: ["string", "null"], format: date-time }
        dataQuality: { type: ["string", "null"] }
        zScore: { type: ["number", "null"] }
        reliabilityFlag: { type: ["string", "null"], description: "null=clean | 'insufficient data — override required' | 'unreliable — structural growth/launch, override recommended' | 'thin data — review'" }

    BufferCategoryUpdate:
      type: object
      properties:
        multiplier: { type: number, minimum: 0 }
        overrideMultiplier: { type: ["number", "null"], minimum: 0 }

    SeasonalityRecomputeResult:
      type: object
      required: [categories, computedAt, zScore, totalOrderQty, totalUnmappedQty, segmentBenchmark]
      properties:
        categories:
          type: array
          items:
            $ref: "#/components/schemas/BufferCategory"
        segmentBenchmark:
          $ref: "#/components/schemas/SeasonalityBenchmark"
        computedAt: { type: string, format: date-time }
        zScore: { type: number }
        totalOrderQty: { type: number }
        totalUnmappedQty: { type: number }

    SeasonalityBenchmark:
      type: object
      required: [category]
      properties:
        category: { type: string }
        avgMonth: { type: ["number", "null"] }
        cv: { type: ["number", "null"] }
        suggestedMultiplier: { type: ["number", "null"] }
        peakMonth: { type: ["string", "null"] }
        peakIndex: { type: ["number", "null"] }
        yoy: { type: ["number", "null"] }
        signal: { type: ["string", "null"] }
        dataQuality: { type: ["string", "null"] }
        volatilityClass: { type: ["string", "null"] }

    UploadedFile:
      type: object
      required: [id, kind, filename, uploadedAt, rowCount]
      properties:
        id: { type: integer }
        kind:
          $ref: "#/components/schemas/UploadKind"
        filename: { type: string }
        uploadedAt: { type: string, format: date-time }
        rowCount: { type: integer }

    SyncSource:
      type: object
      required: [id, name, status, lastSyncedAt, message]
      properties:
        id: { type: string }
        name: { type: string }
        status:
          type: string
          enum: [idle, syncing, success, error]
        lastSyncedAt: { type: ["string", "null"], format: date-time }
        message: { type: ["string", "null"] }

    PlanItem:
      type: object
      required:
        - itemCode
        - colour
        - category
        - avg3MoSale
        - stock
        - bufferReq
        - minProduction
        - maxProduction
        - pendingOrderLastMonth
        - pendingOrder
        - order
        - achievementPct
        - cover
        - week
        - w1
        - w2
        - w3
        - w4
      properties:
        itemCode: { type: string }
        colour: { type: string }
        category: { type: string }
        avg3MoSale: { type: number }
        stock: { type: number }
        bufferReq: { type: number }
        minProduction: { type: number }
        maxProduction: { type: number }
        pendingOrderLastMonth: { type: number }
        pendingOrder: { type: number }
        order: { type: number }
        achievementPct: { type: ["number", "null"] }
        cover:
          oneOf:
            - type: number
            - type: string
              enum: ["OS"]
        week: { type: ["integer", "null"] }
        w1: { type: number }
        w2: { type: number }
        w3: { type: number }
        w4: { type: number }
        weightKg: { type: number, description: "Total kg for this item (Plumbing only). Computed as maxProduction × weight_per_pcs from BOM sheet. 0 when noBomWeight is true. Absent for PTMT items." }
        noBomWeight: { type: boolean, description: "True when item has no BOM weight entry — must be flagged in UI, never silently dropped. Absent for PTMT items." }
        machineW1: { type: number, description: "Machine-feasible W1 quantity (Plumbing only; may differ from w1 due to capacity re-timing)." }
        machineW2: { type: number, description: "Machine-feasible W2 quantity." }
        machineW3: { type: number, description: "Machine-feasible W3 quantity." }
        machineW4: { type: number, description: "Machine-feasible W4 quantity." }
        assignedMachineId: { type: ["string", "null"], description: "Machine ID the item was assigned to; null = unconstrained (solvent, no BOM weight)." }
        machineWeek: { type: ["integer", "null"], description: "Week (1–4) the machine cascade assigned this item to; null if unfulfillable." }
        machineUnfulfillable: { type: boolean, description: "True if the item could not be scheduled in any week given machine capacity." }

    CategorySummary:
      type: object
      required: [category, minTotal, maxTotal]
      properties:
        category: { type: string }
        minTotal: { type: number }
        maxTotal: { type: number }

    PlanSummary:
      type: object
      required: [month, categories, grandMinTotal, grandMaxTotal]
      properties:
        month: { type: string }
        categories:
          type: array
          items:
            $ref: "#/components/schemas/CategorySummary"
        grandMinTotal: { type: number }
        grandMaxTotal: { type: number }

    CreatePlanRunRequest:
      type: object
      required: [month]
      properties:
        month: { type: string }
        segment: { type: string }
        note: { type: string }

    PlanRunSummary:
      type: object
      required: [id, month, segment, asOfAt, status, note, itemCount, grandMinTotal, grandMaxTotal, createdAt]
      properties:
        id: { type: integer }
        month: { type: string }
        segment: { type: string }
        asOfAt: { type: string, format: date-time }
        status: { type: string, enum: [draft, finalized] }
        note: { type: ["string", "null"] }
        itemCount: { type: integer }
        grandMinTotal: { type: number }
        grandMaxTotal: { type: number }
        createdAt: { type: string, format: date-time }

    PlanRunItem:
      type: object
      required: [itemCode, colour, category, avg3MoSale, stock, pendingCurrent, pendingLastMonth, bufferReq, minProduction, productionPlan]
      properties:
        itemCode: { type: string }
        colour: { type: string }
        category: { type: string }
        avg3MoSale: { type: number }
        stock: { type: number }
        pendingCurrent: { type: number }
        pendingLastMonth: { type: number }
        bufferReq: { type: number }
        minProduction: { type: number }
        productionPlan: { type: number }

    PlanRunDetail:
      type: object
      required: [run, items]
      properties:
        run:
          $ref: "#/components/schemas/PlanRunSummary"
        items:
          type: array
          items:
            $ref: "#/components/schemas/PlanRunItem"

    PlanRunDriftCategory:
      type: object
      required: [category, frozenMax, liveMax, delta]
      properties:
        category: { type: string }
        frozenMax: { type: number }
        liveMax: { type: number }
        delta: { type: number }

    PlanRunDriftItem:
      type: object
      required: [itemCode, colour, category, frozenPlan, livePlan, delta]
      properties:
        itemCode: { type: string }
        colour: { type: string }
        category: { type: string }
        frozenPlan: { type: number }
        livePlan: { type: number }
        delta: { type: number }

    PlanRunDrift:
      type: object
      required: [runId, month, segment, status, asOfAt, frozenGrandTotal, liveGrandTotal, grandDelta, categories, changedItems, changedItemCount]
      properties:
        runId: { type: integer }
        month: { type: string }
        segment: { type: string }
        status: { type: string }
        asOfAt: { type: string, format: date-time }
        frozenGrandTotal: { type: number }
        liveGrandTotal: { type: number }
        grandDelta: { type: number }
        categories:
          type: array
          items: { $ref: "#/components/schemas/PlanRunDriftCategory" }
        changedItems:
          type: array
          items: { $ref: "#/components/schemas/PlanRunDriftItem" }
        changedItemCount: { type: integer }

    PlanRunDiffItem:
      type: object
      required: [itemCode, colour, category, minProductionDelta, productionPlanDelta, pendingCurrentDelta, stockDelta]
      properties:
        itemCode: { type: string }
        colour: { type: string }
        category: { type: string }
        minProductionDelta: { type: number }
        productionPlanDelta: { type: number }
        pendingCurrentDelta: { type: number }
        stockDelta: { type: number }

    PlanRunDiff:
      type: object
      required: [run1Id, run2Id, grandMinDelta, grandMaxDelta, items]
      properties:
        run1Id: { type: integer }
        run2Id: { type: integer }
        grandMinDelta: { type: number }
        grandMaxDelta: { type: number }
        items:
          type: array
          items:
            $ref: "#/components/schemas/PlanRunDiffItem"

    DashboardSnapshot:
      type: object
      required:
        - latestMonth
        - itemCount
        - categoryCount
        - grandMinTotal
        - grandMaxTotal
        - lastSyncedAt
      properties:
        latestMonth: { type: ["string", "null"] }
        itemCount: { type: integer }
        categoryCount: { type: integer }
        grandMinTotal: { type: number }
        grandMaxTotal: { type: number }
        lastSyncedAt: { type: ["string", "null"], format: date-time }

    OkResult:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }

    RagBand:
      type: ["string", "null"]
      enum: [green, amber, red, null]

    CalendarModel:
      type: object
      required: [workingDays, elapsed, remaining]
      properties:
        workingDays: { type: integer }
        elapsed: { type: integer }
        remaining: { type: integer }

    PaceMetrics:
      type: object
      required:
        - targetKg
        - outputToDateKg
        - requiredPerDay
        - expectedCumulative
        - paceIndex
        - actualPerDay
        - projectedMonthEnd
        - projectedAttainmentPct
        - daysAheadBehind
        - catchUpPerDay
        - catchUpVsPlanPct
        - attainmentPct
      properties:
        targetKg: { type: number }
        outputToDateKg: { type: number }
        requiredPerDay: { type: number }
        expectedCumulative: { type: number }
        paceIndex: { type: ["number", "null"] }
        actualPerDay: { type: ["number", "null"] }
        projectedMonthEnd: { type: ["number", "null"] }
        projectedAttainmentPct: { type: ["number", "null"] }
        daysAheadBehind: { type: ["number", "null"] }
        catchUpPerDay: { type: ["number", "null"] }
        catchUpVsPlanPct: { type: ["number", "null"] }
        attainmentPct: { type: ["number", "null"] }

    NeedsReviewItem:
      type: object
      required: [itemCode, colour, category]
      properties:
        itemCode: { type: string }
        colour: { type: string }
        category: { type: string }

    MonitoringDashboardCategory:
      type: object
      required: [category, target, requiredPerDay, ragBand]
      properties:
        category: { type: string }
        target: { type: number }
        requiredPerDay: { type: number }
        ragBand:
          $ref: "#/components/schemas/RagBand"

    MonitoringDashboard:
      type: object
      required:
        - month
        - dataAvailable
        - lastDataDate
        - calendar
        - plant
        - categories
        - needsReviewItems
        - warningCount
        - utilisationHeadline
      properties:
        month: { type: string }
        dataAvailable: { type: boolean }
        lastDataDate: { type: ["string", "null"] }
        calendar:
          $ref: "#/components/schemas/CalendarModel"
        plant:
          allOf:
            - $ref: "#/components/schemas/PaceMetrics"
            - type: object
              properties:
                ragBand:
                  $ref: "#/components/schemas/RagBand"
        categories:
          type: array
          items:
            $ref: "#/components/schemas/MonitoringDashboardCategory"
        needsReviewItems:
          type: array
          items:
            $ref: "#/components/schemas/NeedsReviewItem"
        warningCount: { type: integer }
        utilisationHeadline: { type: ["number", "null"] }

    MonitoringVelocityCategory:
