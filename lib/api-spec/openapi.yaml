          type: string
          description: "Upstream failure category (for example: auth-redirect, bad-json, timeout)"

    PlantLivePlant:
      type: object
      required: [code, name, location, daily_wired, daily_months]
      properties:
        code: { type: string }
        name: { type: string }
        location: { type: string }
        daily_wired: { type: boolean }
        daily_months:
          type: array
          items: { type: string }

    PlantLivePlantsResponse:
      type: object
      required: [plants]
      properties:
        plants:
          type: array
          items:
            $ref: "#/components/schemas/PlantLivePlant"

    PlantLiveMachineMetrics:
      type: object
      required: [headline, headline_label, headline_rating, total_count_basis, unit]
      properties:
        headline: { type: ["number", "null"] }
        headline_label: { type: string }
        headline_rating: { type: string }
        utilisation: { type: ["number", "null"] }
        util_rating: { type: string }
        util_available: { type: boolean }
        output_efficiency: { type: ["number", "null"] }
        oee: { type: ["number", "null"] }
        oee_rating: { type: string }
        good_count: { type: ["number", "null"] }
        total_count: { type: ["number", "null"] }
        reject_count: { type: ["number", "null"] }
        rejection_pct: { type: ["number", "null"] }
        total_count_basis: { type: string, enum: [net, gross] }
        actual_hours: { type: ["number", "null"] }
        ideal_hours: { type: ["number", "null"] }
        unit: { type: string }
        row_count: { type: integer }
        baseline_set: { type: boolean }
        warnings:
          type: array
          items: { type: string }

    PlantLivePeriodsResponse:
      type: object
      required: [period_tokens, months_with_data]
      properties:
        period_tokens:
          type: array
          items: { type: string }
        months_with_data:
          type: array
          items: { type: string }

    PlantLiveRecordRow:
      type: object
      description: Raw production row with provenance; upstream may add fields.
      additionalProperties: true
      properties:
        date: { type: string }
        plant: { type: string }
        machine: { type: string }
        segment: { type: string }
        period: { type: string }
        grain: { type: string }
        unit: { type: string }
        total_count: { type: ["number", "null"] }
        reject_count: { type: ["number", "null"] }
        actual_hours: { type: ["number", "null"] }
        ideal_hours: { type: ["number", "null"] }
        downtime_min: { type: ["number", "null"] }
        source_family: { type: string }
        source_file: { type: string }
        source_tab: { type: string }

    PlantLiveRecordsResponse:
      type: object
      required: [period, rows, row_count]
      properties:
        period:
          $ref: "#/components/schemas/PlantLivePeriod"
        rows:
          type: array
          items:
            $ref: "#/components/schemas/PlantLiveRecordRow"
        row_count: { type: integer }
        confirmation_status: { type: string }
        figures_gated: { type: boolean }
        quarantined:
          type: array
          items: {}

    PlantLivePeriod:
      type: object
      required: [requested, label, from, to]
      properties:
        requested: { type: string }
        label: { type: string }
        from: { type: string }
        to: { type: string }

    PlantLiveSummaryResponse:
      type: object
      required: [period, by_machine, by_date]
      properties:
        period:
          $ref: "#/components/schemas/PlantLivePeriod"
        row_count: { type: integer }
        by_machine:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/PlantLiveMachineMetrics"
        by_date:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/PlantLiveMachineMetrics"

    PlumbingMachine:
      type: object
      required: [id, segment, pool, machineId, shiftsPerDay, hoursPerShift, workingDays, rates, lockedOut]
      properties:
        id: { type: integer }
        segment: { type: string }
        pool: { type: string, description: "PIPE or MOULDING" }
        machineId: { type: string }
        label: { type: ["string", "null"] }
        shiftsPerDay: { type: number }
        hoursPerShift: { type: number }
        workingDays: { type: integer }
        rates:
          type: object
          additionalProperties: { type: number }
          description: "Per-material kg/hr rates (PIPE: CPVC/UPVC/SWR/AGRI; MOULDING: ALL)"
        lockedOut: { type: boolean }

    PlumbingMachineUpdate:
      type: object
      properties:
        shiftsPerDay: { type: number }
        hoursPerShift: { type: number }
        workingDays: { type: number, description: "Monthly working days for capacity calculation" }
        lockedOut: { type: boolean }
        rates:
          type: object
          additionalProperties: { type: number }
          description: "Per-material production rates in kg/hr. Keys are material codes (e.g. CPVC, ALL)."

    MachineWeekUtilisation:
      type: object
      required: [machineId, pool, label, week, hoursUsed, hoursAvailable, utilisationPct]
      properties:
        machineId: { type: string }
        pool: { type: string }
        label: { type: ["string", "null"] }
        week: { type: integer, description: "1–4" }
        hoursUsed: { type: number }
        hoursAvailable: { type: number }
        utilisationPct: { type: number }

    MachineUnfulfillableItem:
      type: object
      required: [itemCode, category, pieces, bindingMachine]
      properties:
        itemCode: { type: string }
        category: { type: string }
        pieces: { type: number }
        bindingMachine:
          type: ["string", "null"]
          description: "Machine ID that was most loaded (bottleneck) when this item could not be placed."

    MachineFeasibleCategorySummary:
      type: object
      required: [category, desiredPcs, feasiblePcs, unfulfillablePcs]
      properties:
        category: { type: string }
        desiredPcs: { type: number }
        feasiblePcs: { type: number }
        unfulfillablePcs: { type: number }

    MachineFeasibleSummary:
      type: object
      required: [categories, utilisation, unfulfillable]
      properties:
        categories:
          type: array
          items: { $ref: "#/components/schemas/MachineFeasibleCategorySummary" }
        utilisation:
          type: array
          items: { $ref: "#/components/schemas/MachineWeekUtilisation" }
        unfulfillable:
          type: array
          items: { $ref: "#/components/schemas/MachineUnfulfillableItem" }

    MachineCapacityResponse:
      type: object
      required: [machines, utilisation, unfulfillable]
      properties:
        machines:
          type: array
          items:
            $ref: "#/components/schemas/PlumbingMachine"
        utilisation:
          type: array
          items:
            $ref: "#/components/schemas/MachineWeekUtilisation"
        unfulfillable:
          type: array
          items:
            $ref: "#/components/schemas/MachineUnfulfillableItem"

    ProductListRow:
      type: object
      required: [key, segment, itemCode, colour, productName, division, category, status, source, note, inCatalogue, inPlanningWorkbook, lastSeenProductionMonth, pendingQuantity, dummyQuantity, bufferReq, auditCount]
      properties:
        key: { type: string }
        segment: { type: string, enum: [PTMT, Plumbing, CP] }
        itemCode: { type: string }
        colour: { type: ["string", "null"] }
        productName: { type: ["string", "null"] }
        division: { type: ["string", "null"] }
        category: { type: string }
        status: { type: string, enum: [classified, unclassified, ambiguous] }
        source: { type: ["string", "null"], enum: [workbook, rate-list, catalogue, seed, mrp, null] }
        note: { type: ["string", "null"] }
        inCatalogue: { type: boolean }
        inPlanningWorkbook: { type: boolean }
        lastSeenProductionMonth: { type: ["string", "null"] }
        pendingQuantity: { type: number }
        dummyQuantity: { type: number }
        bufferReq: { type: ["number", "null"] }
        auditCount: { type: integer }

    ProductListResponse:
      type: object
      required: [rows, total, categories]
      properties:
        rows:
          type: array
          items: { $ref: "#/components/schemas/ProductListRow" }
        total: { type: integer }
        categories:
          type: array
          items: { type: string }

    RateListReport:
      type: object
      required: [source, julySource, reconciliation, rangeAudit, categorySplit]
      properties:
        source:
          $ref: "#/components/schemas/RateListSource"
        julySource:
          $ref: "#/components/schemas/RateListSource"
        reconciliation:
          $ref: "#/components/schemas/RateListReconciliation"
        coverage:
          $ref: "#/components/schemas/RateListCoverage"
        rangeAudit:
          type: array
          items:
            $ref: "#/components/schemas/RateListRangeAudit"
        categorySplit:
          $ref: "#/components/schemas/RateListCategorySplitReport"

    MrpImportResult:
      type: object
      required: [sourceId, sourceFilename, sourceSha256, productRowCount, discontinuedRowCount, excludedRowCount, seriesValueCount, planningApproved, holdReason]
      properties:
        sourceId: { type: integer }
        sourceFilename: { type: string }
        sourceSha256: { type: string }
        productRowCount: { type: integer }
        discontinuedRowCount: { type: integer }
        excludedRowCount: { type: integer }
        seriesValueCount: { type: integer }
        planningApproved: { type: boolean }
        holdReason: { type: string }

    MrpReport:
      type: object
      required: [source, summary]
      properties:
        source:
          type: ["object", "null"]
          additionalProperties: true
        summary:
          type: ["object", "null"]
          additionalProperties: true

    RateListRangeAudit:
      type: object
      required: [rangeName, category, codeCount]
      properties:
        rangeName: { type: string }
        category: { type: string }
        codeCount: { type: integer }

    RateListCategorySplitReport:
      type: object
      required: [before, after]
      properties:
        before:
          type: array
          items:
            $ref: "#/components/schemas/RateListCategorySplit"
        after:
          type: array
          items:
            $ref: "#/components/schemas/RateListCategorySplit"

    RateListCategorySplit:
      type: object
      required: [category, codeCount, julySourceQuantity, multiplier]
      properties:
        category: { type: string }
        codeCount: { type: integer }
        julySourceQuantity: { type: number }
        multiplier: { type: ["number", "null"] }

    RateListCoverage:
      type: ["object", "null"]
      properties:
        rateListOnlyCodeCount: { type: integer }
        itemMasterOnlyCodeCount: { type: integer }
        bothSourceCodeCount: { type: integer }
        crossSegmentCodeCount: { type: integer }
        legacyReconciliation:
          $ref: "#/components/schemas/RateListReconciliation"
        explainedExclusions:
          type: array
          items:
            $ref: "#/components/schemas/RateListUnmatchedCode"
        remainingReviewCodes:
          type: array
          items:
            $ref: "#/components/schemas/RateListUnmatchedCode"

    RateListSource:
      type: ["object", "null"]
      properties:
        id: { type: integer }
        filename: { type: string }
        rowCount: { type: integer }
        uploadedAt: { type: string, format: date-time }
        distinctCodeCount: { type: integer }

    RateListReconciliation:
      type: ["object", "null"]
      properties:
        rateListCodeCount: { type: integer }
        rosterCodeCount: { type: integer }
        sourceCodeCount: { type: integer }
        matchedCodeCount: { type: integer }
        unmatchedCodeCount: { type: integer }
        matchedQuantity: { type: number }
        unmatchedQuantity: { type: number }
        unmatchedCodes:
          type: array
          items:
            $ref: "#/components/schemas/RateListUnmatchedCode"

    RateListUnmatchedCode:
      type: object
      required: [code, quantity]
      properties:
        code: { type: string }
        quantity: { type: number }

    ProductReclassificationInput:
      type: object
      required: [segment, category, status, reason]
      properties:
        segment: { type: string, enum: [PTMT, Plumbing, CP] }
        category: { type: string }
        status: { type: string, enum: [classified, unclassified, ambiguous] }
        reason: { type: string }

    AlertState:
      type: string
      enum: [clear, fired, muted, suppressed]

    AlertSeverity:
      type: string
      enum: [red]

    AlertSourceLink:
      type: object
      required: [label, href]
      properties:
        label: { type: string }
        href: { type: string }

    Alert:
      type: object
      required: [id, code, segment, month, severity, state, title, action, message, value, threshold, difference, quantity, details, sourceLinks, firstSeenAt, lastEvaluatedAt, acknowledgedAt, acknowledgedBy, mutedUntil, muteReason, suppressedReason]
      properties:
        id: { type: ["integer", "null"] }
        code: { type: string, enum: [R1, R2, R3, R4, R5, R6, R7] }
        segment: { type: string, enum: [PTMT, Plumbing] }
        month: { type: string }
        severity: { $ref: "#/components/schemas/AlertSeverity" }
        state: { $ref: "#/components/schemas/AlertState" }
        title: { type: string }
        action: { type: string }
        message: { type: string }
        value: { type: ["number", "null"] }
        threshold: { type: ["number", "null"] }
        difference: { type: ["number", "null"] }
        quantity: { type: number }
        details: { type: object, additionalProperties: true }
        sourceLinks:
          type: array
          items: { $ref: "#/components/schemas/AlertSourceLink" }
        firstSeenAt: { type: ["string", "null"], format: date-time }
        lastEvaluatedAt: { type: string, format: date-time }
        acknowledgedAt: { type: ["string", "null"], format: date-time }
        acknowledgedBy: { type: ["string", "null"] }
        mutedUntil: { type: ["string", "null"], format: date-time }
        muteReason: { type: ["string", "null"] }
        suppressedReason: { type: ["string", "null"] }

    AlertThreshold:
      type: object
      required: [code, segment, name, description, value, defaultValue, unit, scope, observedMin, observedMax, wouldFireCount, updatedBy, updatedAt]
      properties:
        code: { type: string, enum: [R1, R2, R3, R4, R5, R6, R7] }
        segment: { type: string, enum: [PTMT, Plumbing] }
        name: { type: string }
        description: { type: string }
        value: { type: number }
        defaultValue: { type: number }
        unit: { type: string }
        scope: { type: string }
        observedMin: { type: ["number", "null"] }
        observedMax: { type: ["number", "null"] }
        wouldFireCount: { type: integer }
        updatedBy: { type: ["string", "null"] }
        updatedAt: { type: string, format: date-time }

    AlertSummary:
      type: object
      required: [total, fired, muted, suppressed, clear, quantityAtStake]
      properties:
        total: { type: integer }
        fired: { type: integer }
        muted: { type: integer }
        suppressed: { type: integer }
        clear: { type: integer }
        quantityAtStake: { type: number }

    AlertsResponse:
      type: object
      required: [month, segment, summary, alerts, thresholds]
      properties:
        month: { type: string }
        segment: { type: string, enum: [PTMT, Plumbing] }
        summary: { $ref: "#/components/schemas/AlertSummary" }
        alerts:
          type: array
          items: { $ref: "#/components/schemas/Alert" }
        thresholds:
          type: array
          items: { $ref: "#/components/schemas/AlertThreshold" }

    AlertHistoryEvent:
      type: object
      required: [id, alertId, code, segment, month, state, value, threshold, difference, quantity, message, details, sourceLinks, occurredAt, actor, action]
      properties:
        id: { type: integer }
        alertId: { type: integer }
        code: { type: string }
        segment: { type: string }
        month: { type: string }
        state: { type: string }
        value: { type: ["number", "null"] }
        threshold: { type: ["number", "null"] }
        difference: { type: ["number", "null"] }
        quantity: { type: number }
        message: { type: string }
        details: { type: object, additionalProperties: true }
        sourceLinks:
          type: array
          items: { $ref: "#/components/schemas/AlertSourceLink" }
        occurredAt: { type: string, format: date-time }
        actor: { type: ["string", "null"] }
        action: { type: string }

    AlertHistoryResponse:
      type: object
      required: [segment, history]
      properties:
        segment: { type: string, enum: [PTMT, Plumbing] }
        history:
          type: array
          items: { $ref: "#/components/schemas/AlertHistoryEvent" }

    MuteAlertRequest:
      type: object
      required: [reason, mutedUntil]
      properties:
        reason: { type: string, minLength: 1 }
        mutedUntil: { type: string, format: date-time }

    UpdateAlertThresholdRequest:
      type: object
      required: [segment, value, reason]
      properties:
        segment: { type: string, enum: [PTMT, Plumbing] }
        value: { type: number, minimum: 0 }
        reason: { type: string, minLength: 1 }

    AlertActionResponse:
      type: object
      required: [ok, alert]
      properties:
        ok: { type: boolean }
        alert: { $ref: "#/components/schemas/Alert" }

    AlertThresholdActionResponse:
      type: object
      required: [ok, threshold]
      properties:
        ok: { type: boolean }
        threshold: { $ref: "#/components/schemas/AlertThreshold" }
