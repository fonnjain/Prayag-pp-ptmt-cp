        mixFlags:
          type: array
          items:
            $ref: "#/components/schemas/PlantMixFlag"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/PlantWarning"
        recommendations:
          type: array
          items:
            $ref: "#/components/schemas/PlantRecommendation"
        needsReview:
          type: array
          items:
            $ref: "#/components/schemas/NeedsReviewItem"
        caveats:
          type: array
          items: { type: string }
        dataAvailable: { type: boolean }
        monitoringStatus: { type: string, enum: [live, grace, frozen, unavailable, future] }
        targetsAvailable: { type: boolean }
        actualsAvailable: { type: boolean }
