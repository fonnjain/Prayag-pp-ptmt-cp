          pattern: '^\d{4}-(0[1-9]|1[0-2])$'

    PlantSnapshotBackfillResult:
      type: object
      required: [month, status, capturedAt]
      properties:
        month: { type: string }
        status: { type: string, enum: [frozen] }
        capturedAt: { type: string }

    PlantSnapshotBackfillError:
      type: object
      required: [error, message]
      properties:
        error: { type: string }
        message: { type: string }
        month: { type: string }

    PlantTrendSummary:
      type: object
      required: [month, workingDays]
      properties:
        month: { type: string }
        workingDays: { type: integer }
        attainmentMaxPct: { type: ["number", "null"] }
        attainmentMinPct: { type: ["number", "null"] }
        avgDailyPcs: { type: ["number", "null"] }
        linearityIndex: { type: ["number", "null"] }
        producedTotal: { type: ["number", "null"] }
        targetMax: { type: ["number", "null"] }
        targetMin: { type: ["number", "null"] }
        bestCategory: { type: ["string", "null"] }
        worstCategory: { type: ["string", "null"] }
        ragBand: { type: ["string", "null"] }

    PlantSourceConfigItem:
      type: object
      required: [month, fileId]
      properties:
        month: { type: string }
        fileId: { type: string }
        notes: { type: ["string", "null"] }
        createdAt: { type: string }

    PlantConfigData:
      type: object
      required: [month, workingDays, workingDaysSource, shiftsPerDay, shiftHours, snapshotDate, sourceConfigs]
      properties:
        month: { type: string }
        workingDays: { type: integer }
        workingDaysSource: { type: string, enum: [configured, derived] }
        shiftsPerDay: { type: integer }
        shiftHours: { type: integer }
        snapshotDate: { type: ["string", "null"] }
        sourceConfigs:
          type: array
          items:
            $ref: "#/components/schemas/PlantSourceConfigItem"

    PlantConfigUpdate:
      type: object
      required: [month]
      properties:
        month: { type: string }
        workingDays: { type: [integer, "null"] }
        shiftsPerDay: { type: integer }
        shiftHours: { type: integer }
        snapshotDate: { type: ["string", "null"] }
        thresholds: { type: object, additionalProperties: true }

    AiPlantAnalysisResult:
      type: object
      required: [executive_summary, pp_verdict, key_findings, root_cause_hypotheses, risks, recommendations, watch_items]
      properties:
        executive_summary: { type: string }
        pp_verdict:
          type: object
          required: [max_pp, min_pp]
          properties:
            max_pp:
              type: object
              required: [rag, verdict]
              properties:
                attainment_pct: { type: ["number", "null"] }
                projected_attainment_pct: { type: ["number", "null"] }
                rag: { type: ["string", "null"] }
                verdict: { type: string }
            min_pp:
              type: object
              required: [rag, verdict]
              properties:
                projected_attainment_pct: { type: ["number", "null"] }
                rag: { type: ["string", "null"] }
                verdict: { type: string }
        key_findings:
          type: array
          items:
            type: object
            required: [finding, evidence, scope]
            properties:
              finding: { type: string }
              evidence: { type: string }
              scope: { type: string }
        root_cause_hypotheses:
          type: array
          items:
            type: object
            required: [hypothesis, supporting_signal, confidence]
            properties:
              hypothesis: { type: string }
              supporting_signal: { type: string }
              confidence: { type: string, enum: [high, med, low] }
        risks:
          type: array
          items:
            type: object
            required: [risk, severity, basis]
            properties:
              risk: { type: string }
              severity: { type: string, enum: [Critical, High, Medium] }
              basis: { type: string }
        recommendations:
          type: array
          items:
            type: object
            required: [action, rationale, quantified_impact, priority, effort, scope]
            properties:
              action: { type: string }
              rationale: { type: string }
              quantified_impact: { type: string }
              priority: { type: integer }
              effort: { type: string, enum: [low, med, high] }
              scope: { type: string }
        watch_items:
          type: array
          items: { type: string }

    AiPlantAnalysisDetail:
      allOf:
        - $ref: "#/components/schemas/AiAnalysisSummary"
        - type: object
          required: [result, messages]
          properties:
            result:
              anyOf:
                - $ref: "#/components/schemas/AiPlantAnalysisResult"
                - type: "null"
            messages:
              type: array
              items:
                $ref: "#/components/schemas/AiAnalysisMessage"

    PlantSourceConfigUpsert:
      type: object
      required: [month, fileId]
      properties:
        month: { type: string }
        fileId: { type: string }
        notes: { type: string }

    WeeklyReleaseBand:
      type: object
      required: [id, categoryName, w1Upper, w2Upper, w3Upper, w4Upper, updatedAt]
      properties:
        id: { type: integer }
        categoryName: { type: string }
        w1Upper: { type: number }
        w2Upper: { type: number }
        w3Upper: { type: number }
        w4Upper: { type: number }
        updatedAt: { type: string, format: date-time }

    WeeklyReleaseBandUpdate:
      type: object
      required: [w1Upper, w2Upper, w3Upper, w4Upper]
      properties:
        w1Upper: { type: number }
        w2Upper: { type: number }
        w3Upper: { type: number }
        w4Upper: { type: number }

    PlantWeekWindow:
      type: object
      required: [week, startDay, endDay, startDate, endDate, label]
      properties:
        week: { type: integer }
        startDay: { type: integer }
        endDay: { type: integer }
        startDate: { type: string }
        endDate: { type: string }
        label: { type: string }

    PlantWeeklyStats:
      type: object
      required: [week, target, actual, carryover, effectiveTarget, gap, planVersions]
      properties:
        week: { type: integer }
        target: { type: number }
        actual: { type: number }
        carryover: { type: number }
        effectiveTarget: { type: number }
        gap: { type: number }
        attainmentPct:
          nullable: true
          type: number
        attainmentEffectivePct:
          nullable: true
          type: number
        ragBand:
          nullable: true
          type: string
          enum: [green, amber, red]
        planVersions:
          type: array
          description: Issued plan versions whose effective dates govern one or more days in this week.
          items: { type: string }

    CorrectiveReplanInput:
      type: object
      required: [month]
      properties:
        month: { type: string, description: "YYYY-MM" }
        weekClosed: { type: integer, description: "Week just closed (0=none, 1=W1 done, 2=W2 done, 3=W3 done). Required if asOfDate is not provided." }
        asOfDate: { type: string, description: "YYYY-MM-DD — derive weekClosed from this date (filter actuals ≤ date). Mutually exclusive with weekClosed in the UI; weekClosed is derived internally." }
        segment: { type: string, description: "PTMT or Plumbing (default PTMT)" }
        dailyCapacity: { type: number, description: "Pieces per day (default 21335)" }
        workingDaysPerWeek: { type: integer, description: "Working days per week (default 6)" }
        planRunId: { type: ["integer", "null"], description: "Immutable plan run to use as the baseline. Number = that frozen run; null = force live rebuild; omitted = auto (latest finalized run for month+segment, else live)." }

    CorrectiveWeekStat:
      type: object
      required: [week, weekLabel, released, capacity, workingDays, produced, lag, loadFactor, status]
      properties:
        week: { type: integer }
        weekLabel: { type: string }
        released: { type: number }
        capacity: { type: number }
        workingDays: { type: integer }
        produced: { type: number }
        lag: { type: number }
        loadFactor: { type: number }
        status: { type: string, enum: [open, closed, future, unfulfillable] }

    CorrectiveWarning:
      type: object
      required: [code, severity, message]
      properties:
        code: { type: string }
        severity: { type: string, enum: [info, medium, high, critical] }
        message: { type: string }
        value: { type: ["number", "null"] }
        threshold: { type: ["number", "null"] }
        category: { type: ["string", "null"] }
        items:
          type: array
          items: { type: string }

    CorrectiveItemResult:
      type: object
      required: [itemCode, colour, category, avg3MoSale, bufferMultiplier, stockOpen, producedToDate, stockNow, pendingAtPlan, pendingNow, pendingLastMonth, originalPlan, bufferReqRev, planRev, remainingToProduce, kgRev, remainingKg, deltaNewOrders, deltaProduction, deltaNet, w1Rev, w2Rev, w3Rev, w4Rev, temporaryCorrective, correctiveProduction, cannotBeMade, feasibilityStatus, status, isNewItem]
      properties:
        itemCode: { type: string }
        colour: { type: string }
        category: { type: string }
        avg3MoSale: { type: number }
        bufferMultiplier: { type: number }
        stockOpen: { type: number }
        producedToDate: { type: number }
        stockNow: { type: number }
        pendingAtPlan: { type: number }
        pendingNow: { type: number }
        pendingLastMonth: { type: number }
        originalPlan: { type: number }
        originalWeek: { type: ["integer", "null"] }
        bufferReqRev: { type: number }
        planRev: { type: number }
        remainingToProduce: { type: number }
        kgRev: { type: number, description: "Revised plan quantity in kg (planRev × BOM weight per piece; 0 for PTMT)" }
        remainingKg: { type: number, description: "Remaining to produce in kg; 0 for PTMT" }
        deltaNewOrders: { type: number }
        deltaProduction: { type: number }
        deltaNet: { type: number }
        coverNow: { type: ["number", "null"] }
        newWeek: { type: ["integer", "null"] }
        w1Rev: { type: number }
        w2Rev: { type: number }
        w3Rev: { type: number }
        w4Rev: { type: number }
        temporaryCorrective: { type: number, description: "Demand-true corrective quantity before capacity fitting" }
        correctiveProduction: { type: number, description: "Quantity fitted into open-week capacity or machine schedule" }
        cannotBeMade: { type: number, description: "Temporary corrective quantity not fitted in the open window" }
        cannotBeMadeReason: { type: ["string", "null"] }
        feasibilityStatus: { type: string, enum: [fitted, not-scheduled, unfulfillable] }
        status: { type: string }
        isNewItem: { type: boolean }

    CorrectiveCategoryResult:
      type: object
      required: [category, plan, produced, producedCapped, remaining, capPerDay, feasible, shortfall, productionLag, newDemandDelta, capacityShortfall, flags, kgRemaining, temporaryCorrective, correctiveProduction, cannotBeMade, notScheduled, unfulfillable]
      properties:
        category: { type: string }
        plan: { type: number, description: "Sum of revised plan (planRev) per item in this category" }
        produced: { type: number, description: "Total produced to date for plan items in this category" }
        producedCapped: { type: number, description: "Sum of min(produced, planRev) per item — counts toward plan" }
        remaining: { type: number, description: "plan − producedCapped — what still needs to be produced" }
        capPerDay: { type: number, description: "p90 of daily category output from actuals (Plumbing: Sheet3; PTMT: DB override or suggested)" }
        feasible: { type: number, description: "capPerDay × workingDaysRemaining — production possible in remaining time" }
        shortfall: { type: number, description: "max(remaining − feasible, 0)" }
        productionLag: { type: number, description: "max(sum(originalPlan) − produced, 0) — how far behind original plan" }
        newDemandDelta: { type: number, description: "sum(max(deltaNewOrders, 0)) — new orders added mid-month" }
        capacityShortfall: { type: number, description: "Alias for shortfall for variance-attribution clarity" }
        flags:
          type: array
          items: { type: string }
          description: "UNFULFILLABLE_THIS_MONTH | NOT_STARTED | NO_DEMONSTRATED_CAPACITY"
        kgRemaining: { type: number, description: "Total remaining kg for Plumbing categories; 0 for PTMT" }
        temporaryCorrective: { type: number }
        correctiveProduction: { type: number }
        cannotBeMade: { type: number }
        notScheduled: { type: number }
        unfulfillable: { type: number }

    CorrectiveReplanResult:
      type: object
      required: [runId, month, segment, weekClosed, workingDaysUsed, workingDaysRemaining, dailyCapacity, workingDaysPerWeek, producedToDate, newOrdersQty, originalMonthTotal, revisedMonthTotal, unfulfillableQty, notScheduledQty, unfulfillableOnlyQty, weekStats, warnings, items, categories, unplannedTotal, schedulerWeekOffset, schedulerOriginalWeeks, invariants]
      properties:
        runId: { type: integer }
        month: { type: string }
        segment: { type: string }
        weekClosed: { type: integer }
        asOfDate: { type: ["string", "null"], description: "YYYY-MM-DD — effective as-of date (may be derived from weekClosed via P5)" }
        workingDaysUsed: { type: integer, description: "Non-Sunday days from month start to asOfDate inclusive" }
        workingDaysRemaining: { type: integer, description: "Non-Sunday days from day after asOfDate to month end; always set" }
        note: { type: ["string", "null"], description: "Human-readable label e.g. 'As of 18/07/26'" }
        dailyCapacity: { type: number }
        workingDaysPerWeek: { type: integer }
        producedToDate: { type: number }
        newOrdersQty: { type: number }
        originalMonthTotal: { type: number }
        revisedMonthTotal: { type: number }
        unfulfillableQty: { type: number, description: "Backward-compatible aggregate residual." }
        notScheduledQty: { type: number, description: "Residual demand with no assignment yet, but not classified as impossible." }
        unfulfillableOnlyQty: { type: number, description: "Residual demand classified as impossible within the route/capacity/window." }
        weekStats:
          type: array
          items: { $ref: "#/components/schemas/CorrectiveWeekStat" }
        warnings:
          type: array
          items: { $ref: "#/components/schemas/CorrectiveWarning" }
        items:
          type: array
          items: { $ref: "#/components/schemas/CorrectiveItemResult" }
        categories:
          type: array
          items: { $ref: "#/components/schemas/CorrectiveCategoryResult" }
          description: "Per-category aggregates with variance attribution (P7)"
        unplannedProduction:
          type: array
          items:
            type: object
            required: [code, qty]
            properties:
              code: { type: string }
              qty: { type: integer }
          description: "Plumbing Sheet3 codes not matched to any plan item"
        baselinePlanRunId: { type: ["integer", "null"], description: "Immutable plan run cited as the baseline (null = live rebuild)" }
        baselineSource: { type: string, enum: [frozen-run, live], description: "Where the original plan baseline came from" }
        unplannedTotal: { type: integer, description: "Sum of unplannedProduction quantities" }
        frozenPlanGrandMax: { type: ["integer", "null"], description: "Grand total (pcs) from the cited baseline plan run's results rows; null when no frozen baseline or run predates drift tracking" }
        inputProvenance:
          $ref: "#/components/schemas/PlanInputProvenance"
        schedulerWeekOffset: { type: ["integer", "null"], description: "Persisted offset from scheduler-local weeks to original month weeks" }
        schedulerOriginalWeeks:
          type: array
          items: { type: integer }
          description: "Original weeks represented by scheduler-local W1 onward"
        invariants:
          type: object
          required: [temporaryCorrectiveUnchanged, noClosedWeekRelease, weeklyCapacity, producedFloor, reconciliation, allPass]
          properties:
            temporaryCorrectiveUnchanged: { type: boolean }
            noClosedWeekRelease: { type: boolean }
            weeklyCapacity: { type: boolean }
            producedFloor: { type: boolean }
            reconciliation: { type: boolean }
            allPass: { type: boolean }

    CategoryCapacity:
      type: object
      required: [id, category, meanPerDay, p90PerDay, bestDay, daysObserved, trailingDays, isThinData, suggestedCapacity, workingDaysPerWeek, planNeedsPerDay, appliedCapacity, selectedCapacity, selectedWindow, lastComputedAt]
      properties:
        id: { type: integer }
        category: { type: string }
        meanPerDay: { type: number }
        p90PerDay: { type: number }
        bestDay: { type: number }
        daysObserved: { type: integer }
        trailingDays: { type: integer }
        isThinData: { type: integer, description: "1 = fewer than 10 producing days observed — treat as indicative only" }
        suggestedCapacity: { type: number }
        overrideCapacity: { type: ["number", "null"] }
        appliedCapacity: { type: number, description: "override if set, else suggested — all modules use this" }
        selectedCapacity: { type: number, description: "Capacity selected for PTMT Pass 2: override if set, otherwise the adaptive full/recent window value" }
        selectedWindow: { type: string, enum: [fullWindow, recent90d], description: "Window selected for PTMT Pass 2" }
        workingDaysPerWeek: { type: integer }
        planNeedsPerDay: { type: number }
        windowStartDate: { type: ["string", "null"], format: date }
        windowEndDate: { type: ["string", "null"], format: date }
        comparison:
          oneOf:
            - $ref: "#/components/schemas/CapacityComparison"
            - type: "null"
        lastComputedAt: { type: string }

    CapacityWindowStats:
      type: object
      required: [startDate, endDate, daysObserved, meanPerDay, p90PerDay, bestDay]
      properties:
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        daysObserved: { type: integer }
        meanPerDay: { type: number }
        p90PerDay: { type: number }
        bestDay: { type: number }

    CapacityMonthlyStats:
      allOf:
        - $ref: "#/components/schemas/CapacityWindowStats"
        - type: object
          required: [month]
          properties:
            month: { type: string }

    CapacityComparison:
      type: object
      required: [fullWindow, recent90d, monthly, driftPct, recoveryDriftPct, monthlyP90CvPct, latestMonthlyP90, minPositiveMonthlyP90, zeroProductionMonths]
      properties:
        fullWindow: { $ref: "#/components/schemas/CapacityWindowStats" }
        recent90d: { $ref: "#/components/schemas/CapacityWindowStats" }
        monthly:
          type: array
          items: { $ref: "#/components/schemas/CapacityMonthlyStats" }
        driftPct: { type: ["number", "null"], description: "Endpoint drift from first positive-production month to latest positive-production month" }
        recoveryDriftPct: { type: ["number", "null"], description: "Recovery drift from the minimum positive monthly p90 to the latest positive monthly p90" }
        monthlyP90CvPct: { type: ["number", "null"], description: "Population coefficient of variation across positive monthly p90s, expressed as a percentage; high values mean neither window is reliable alone" }
        latestMonthlyP90: { type: ["number", "null"] }
        minPositiveMonthlyP90: { type: ["number", "null"] }
        zeroProductionMonths:
          type: array
          items: { type: string }
          description: "Months with no positive-production observations; not capacity zeros"

    CategoryCapacityUpdate:
      type: object
      properties:
        overrideCapacity: { type: ["number", "null"] }
        workingDaysPerWeek: { type: integer }

    CorrectivePlanRunSummary:
      type: object
      required: [id, segment, month, weekClosed, dailyCapacity, producedToDate, newOrdersQty, originalMonthTotal, revisedMonthTotal, unfulfillableQty, notScheduledTotal, unfulfillableTotal, pinned, warnings, createdAt]
      properties:
        id: { type: integer }
        segment: { type: string }
        month: { type: string }
        weekClosed: { type: integer }
        asOfDate: { type: ["string", "null"] }
        note: { type: ["string", "null"] }
        dailyCapacity: { type: number }
        producedToDate: { type: number }
        newOrdersQty: { type: number }
        originalMonthTotal: { type: number }
        revisedMonthTotal: { type: number }
        unfulfillableQty: { type: number }
        notScheduledTotal: { type: number }
        unfulfillableTotal: { type: number }
        planRunId: { type: ["integer", "null"], description: "Immutable plan run cited as the baseline (null = live rebuild)" }
        pinned: { type: boolean, description: "When true, deletion and frozen-baseline changes are blocked." }
        warnings:
          type: array
          items: { $ref: "#/components/schemas/CorrectiveWarning" }
        createdAt: { type: string }

    PlantWeeklyCategoryRow:
      type: object
      required: [category, weeks]
      properties:
        category: { type: string }
        weeks:
          type: array
          items:
            $ref: "#/components/schemas/PlantWeeklyStats"

    PlantWeeklyPlantSummary:
      type: object
      required: [weeks]
      properties:
        weeks:
          type: array
          items:
            $ref: "#/components/schemas/PlantWeeklyStats"

    PlantWeeklySummary:
      type: object
      required: [month, snapshotDate, weekCalendar, currentWeek, elapsedDaysInWeek, plant, categories]
      properties:
        month: { type: string }
        snapshotDate:
          nullable: true
          type: string
        weekCalendar:
          type: array
          items:
            $ref: "#/components/schemas/PlantWeekWindow"
        currentWeek: { type: integer }
        elapsedDaysInWeek: { type: integer }
        plant:
          $ref: "#/components/schemas/PlantWeeklyPlantSummary"
        categories:
          type: array
          items:
            $ref: "#/components/schemas/PlantWeeklyCategoryRow"

    ApiKey:
      type: object
      required: [id, name, consumer, scopes, segmentScopes, keyPrefix, isActive, createdAt]
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: ["string", "null"] }
