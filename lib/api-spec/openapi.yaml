openapi: 3.1.0
info:
  title: Api
  version: 1.0.0
servers:
  - url: /api
paths:
  /healthz:
    get:
      operationId: getHealthz
      tags: [system]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /buffer-categories:
    get:
      operationId: listBufferCategories
      tags: [bufferCategories]
      responses:
        "200":
          description: List of buffer categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BufferCategory"

  /buffer-categories/{id}:
    patch:
      operationId: updateBufferCategory
      tags: [bufferCategories]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BufferCategoryUpdate"
      responses:
        "200":
          description: Updated buffer category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BufferCategory"
        "404":
          description: Not found

  /uploads:
    get:
      operationId: listUploads
      tags: [uploads]
      responses:
        "200":
          description: List of uploaded source files
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UploadedFile"

  /uploads/{kind}:
    post:
      operationId: createUpload
      tags: [uploads]
      parameters:
        - name: kind
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UploadKind"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Uploaded file processed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadedFile"
        "400":
          description: Invalid file

  /sync/sheets:
    post:
      operationId: syncSheets
      tags: [sync]
      responses:
        "200":
          description: Sync results per source
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SyncSource"

  /sync/status:
    get:
      operationId: getSyncStatus
      tags: [sync]
      responses:
        "200":
          description: Current status of each live sheet source
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SyncSource"

  /plan:
    get:
      operationId: listPlanItems
      tags: [plan]
      parameters:
        - name: month
          in: query
          required: true
          schema: { type: string }
        - name: category
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Computed production plan line items for the month
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlanItem"

  /plan/summary:
    get:
      operationId: getPlanSummary
      tags: [plan]
      parameters:
        - name: month
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Per-category and grand totals for the month
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanSummary"

  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      responses:
        "200":
          description: Top-level dashboard snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSnapshot"

  /plan/export/excel:
    get:
      operationId: exportPlanExcel
      tags: [plan]
      parameters:
        - name: month
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Excel workbook of the production plan
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary

  /plan/export/pdf:
    get:
      operationId: exportPlanPdf
      tags: [plan]
      parameters:
        - name: month
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: PDF report of the production plan
          content:
            application/pdf:
              schema:
                type: string
                format: binary

  /monitoring/dashboard:
    get:
      operationId: getMonitoringDashboard
      tags: [monitoring]
      parameters:
        - name: month
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Monitoring top-level snapshot for the month
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitoringDashboard"

  /monitoring/velocity:
    get:
      operationId: getMonitoringVelocity
      tags: [monitoring]
      parameters:
        - name: month
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Plant and per-category pace/attainment metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitoringVelocity"

  /monitoring/warnings:
    get:
      operationId: getMonitoringWarnings
      tags: [monitoring]
      parameters:
        - name: month
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Ranked list of warnings for the month
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitoringWarnings"

  /monitoring/actions:
    get:
      operationId: getMonitoringActions
      tags: [monitoring]
      parameters:
        - name: month
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Recommended actions for the month
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitoringActions"

  /monitoring/quality:
    get:
      operationId: getMonitoringQuality
      tags: [monitoring]
      parameters:
        - name: month
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Per-machine utilisation/rejection quality data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitoringQuality"

  /monitoring/backlog:
    get:
      operationId: getMonitoringBacklog
      tags: [monitoring]
      parameters:
        - name: month
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Items where stock is below pending orders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitoringBacklog"

  /monitoring/export/excel:
    get:
      operationId: exportMonitoringExcel
      tags: [monitoring]
      parameters:
        - name: month
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Excel workbook of the monitoring snapshot
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary

  /monitoring/export/pdf:
    get:
      operationId: exportMonitoringPdf
      tags: [monitoring]
      parameters:
        - name: month
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: PDF report of the monitoring snapshot
          content:
            application/pdf:
              schema:
                type: string
                format: binary

  /monitoring/weights:
    get:
      operationId: listItemWeights
      tags: [monitoring]
      responses:
        "200":
          description: All configured item weights
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ItemWeight"
    put:
      operationId: upsertItemWeight
      tags: [monitoring]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemWeightUpsert"
      responses:
        "200":
          description: Weight saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResult"

  /monitoring/ideal-hours-overrides:
    get:
      operationId: listIdealHoursOverrides
      tags: [monitoring]
      parameters:
        - name: month
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Ideal-hours overrides
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IdealHoursOverride"
    put:
      operationId: upsertIdealHoursOverride
      tags: [monitoring]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdealHoursOverrideUpsert"
      responses:
        "200":
          description: Override saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResult"

  /monitoring/thresholds:
    get:
      operationId: getMonitoringThresholds
      tags: [monitoring]
      responses:
        "200":
          description: Current warning thresholds
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WarningThresholds"
    put:
      operationId: updateMonitoringThresholds
      tags: [monitoring]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WarningThresholds"
      responses:
        "200":
          description: Thresholds saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResult"

  /monitoring/config:
    get:
      operationId: getMonitoringConfig
      tags: [monitoring]
      parameters:
        - name: month
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Calendar/config settings for the month
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitoringConfig"
    put:
      operationId: updateMonitoringConfig
      tags: [monitoring]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MonitoringConfigUpdate"
      responses:
        "200":
          description: Config saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResult"

  /ai/analyses:
    get:
      operationId: listAiAnalyses
      tags: [ai]
      parameters:
        - name: month
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: History of AI analyses for the month
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AiAnalysisSummary"

  /ai/analyses/{id}:
    get:
      operationId: getAiAnalysis
      tags: [ai]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: A single AI analysis with its follow-up messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiAnalysisDetail"

  /ai/analyses/{id}/export/pdf:
    get:
      operationId: exportAiAnalysisPdf
      tags: [ai]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: PDF export of the AI analysis
          content:
            application/pdf:
              schema:
                type: string
                format: binary

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }

    UploadKind:
      type: string
      enum: [pending_orders, last_month_pending, current_stock]

    BufferCategory:
      type: object
      required: [id, name, multiplier, updatedAt]
      properties:
        id: { type: integer }
        name: { type: string }
        multiplier: { type: number }
        updatedAt: { type: string, format: date-time }

    BufferCategoryUpdate:
      type: object
      required: [multiplier]
      properties:
        multiplier: { type: number, minimum: 0 }

    UploadedFile:
      type: object
      required: [id, kind, filename, uploadedAt, rowCount]
      properties:
        id: { type: integer }
        kind:
          $ref: "#/components/schemas/UploadKind"
        filename: { type: string }
        uploadedAt: { type: string, format: date-time }
        rowCount: { type: integer }

    SyncSource:
      type: object
      required: [id, name, status, lastSyncedAt, message]
      properties:
        id: { type: string }
        name: { type: string }
        status:
          type: string
          enum: [idle, syncing, success, error]
        lastSyncedAt: { type: ["string", "null"], format: date-time }
        message: { type: ["string", "null"] }

    PlanItem:
      type: object
      required:
        - itemCode
        - colour
        - category
        - avg3MoSale
        - stock
        - bufferReq
        - minProduction
        - maxProduction
        - pendingOrderLastMonth
        - pendingOrder
        - order
        - achievementPct
      properties:
        itemCode: { type: string }
        colour: { type: string }
        category: { type: string }
        avg3MoSale: { type: number }
        stock: { type: number }
        bufferReq: { type: number }
        minProduction: { type: number }
        maxProduction: { type: number }
        pendingOrderLastMonth: { type: number }
        pendingOrder: { type: number }
        order: { type: number }
        achievementPct: { type: ["number", "null"] }

    CategorySummary:
      type: object
      required: [category, minTotal, maxTotal]
      properties:
        category: { type: string }
        minTotal: { type: number }
        maxTotal: { type: number }

    PlanSummary:
      type: object
      required: [month, categories, grandMinTotal, grandMaxTotal]
      properties:
        month: { type: string }
        categories:
          type: array
          items:
            $ref: "#/components/schemas/CategorySummary"
        grandMinTotal: { type: number }
        grandMaxTotal: { type: number }

    DashboardSnapshot:
      type: object
      required:
        - latestMonth
        - itemCount
        - categoryCount
        - grandMinTotal
        - grandMaxTotal
        - lastSyncedAt
      properties:
        latestMonth: { type: ["string", "null"] }
        itemCount: { type: integer }
        categoryCount: { type: integer }
        grandMinTotal: { type: number }
        grandMaxTotal: { type: number }
        lastSyncedAt: { type: ["string", "null"], format: date-time }

    OkResult:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }

    RagBand:
      type: ["string", "null"]
      enum: [green, amber, red, null]

    CalendarModel:
      type: object
      required: [workingDays, elapsed, remaining]
      properties:
        workingDays: { type: integer }
        elapsed: { type: integer }
        remaining: { type: integer }

    PaceMetrics:
      type: object
      required:
        - targetKg
        - outputToDateKg
        - requiredPerDay
        - expectedCumulative
        - paceIndex
        - actualPerDay
        - projectedMonthEnd
        - projectedAttainmentPct
        - daysAheadBehind
        - catchUpPerDay
        - catchUpVsPlanPct
        - attainmentPct
      properties:
        targetKg: { type: number }
        outputToDateKg: { type: number }
        requiredPerDay: { type: number }
        expectedCumulative: { type: number }
        paceIndex: { type: ["number", "null"] }
        actualPerDay: { type: ["number", "null"] }
        projectedMonthEnd: { type: ["number", "null"] }
        projectedAttainmentPct: { type: ["number", "null"] }
        daysAheadBehind: { type: ["number", "null"] }
        catchUpPerDay: { type: ["number", "null"] }
        catchUpVsPlanPct: { type: ["number", "null"] }
        attainmentPct: { type: ["number", "null"] }

    NeedsReviewItem:
      type: object
      required: [itemCode, colour, category]
      properties:
        itemCode: { type: string }
        colour: { type: string }
        category: { type: string }

    MonitoringDashboardCategory:
      type: object
      required: [category, target, requiredPerDay, ragBand]
      properties:
        category: { type: string }
        target: { type: number }
        requiredPerDay: { type: number }
        ragBand:
          $ref: "#/components/schemas/RagBand"

    MonitoringDashboard:
      type: object
      required:
        - month
        - dataAvailable
        - lastDataDate
        - calendar
        - plant
        - categories
        - needsReviewItems
        - warningCount
        - utilisationHeadline
      properties:
        month: { type: string }
        dataAvailable: { type: boolean }
        lastDataDate: { type: ["string", "null"] }
        calendar:
          $ref: "#/components/schemas/CalendarModel"
        plant:
          allOf:
            - $ref: "#/components/schemas/PaceMetrics"
            - type: object
              properties:
                ragBand:
                  $ref: "#/components/schemas/RagBand"
        categories:
          type: array
          items:
            $ref: "#/components/schemas/MonitoringDashboardCategory"
        needsReviewItems:
          type: array
          items:
            $ref: "#/components/schemas/NeedsReviewItem"
        warningCount: { type: integer }
        utilisationHeadline: { type: ["number", "null"] }

    MonitoringVelocityCategory:
      allOf:
        - $ref: "#/components/schemas/PaceMetrics"
        - type: object
          required: [category, ragBand]
          properties:
            category: { type: string }
            ragBand:
              $ref: "#/components/schemas/RagBand"

    MonitoringVelocity:
      type: object
      required: [month, plant, categories]
      properties:
        month: { type: string }
        plant:
          allOf:
            - $ref: "#/components/schemas/PaceMetrics"
            - type: object
              properties:
                ragBand:
                  $ref: "#/components/schemas/RagBand"
        categories:
          type: array
          items:
            $ref: "#/components/schemas/MonitoringVelocityCategory"

    Warning:
      type: object
      required: [code, severity, scope, message, value, threshold, source]
      properties:
        code: { type: string }
        severity: { type: string, enum: [info, medium, high, critical] }
        scope: { type: string }
        message: { type: string }
        value: { type: ["number", "null"] }
        threshold: { type: ["number", "null"] }
        source: { type: string }

    MonitoringWarnings:
      type: object
      required: [month, warnings]
      properties:
        month: { type: string }
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/Warning"

    RecommendedAction:
      type: object
      required: [priority, code, scope, message, suggestedQty]
      properties:
        priority: { type: integer }
        code: { type: string }
        scope: { type: string }
        message: { type: string }
        suggestedQty: { type: ["number", "null"] }

    MonitoringActions:
      type: object
      required: [month, actions]
      properties:
        month: { type: string }
        actions:
          type: array
          items:
            $ref: "#/components/schemas/RecommendedAction"

    MachineQuality:
      type: object
      required:
        - machineId
        - isGrinder
        - runHours
        - idealHours
        - utilisationPct
        - outputKg
        - rejectionKg
        - rejectionPct
        - goodOutputKg
      properties:
        machineId: { type: string }
        isGrinder: { type: boolean }
        runHours: { type: number }
        idealHours: { type: ["number", "null"] }
        utilisationPct: { type: ["number", "null"] }
        outputKg: { type: number }
        rejectionKg: { type: ["number", "null"] }
        rejectionPct: { type: ["number", "null"] }
        goodOutputKg: { type: ["number", "null"] }

    MonitoringQuality:
      type: object
      required: [month, dataAvailable, machines]
      properties:
        month: { type: string }
        dataAvailable: { type: boolean }
        machines:
          type: array
          items:
            $ref: "#/components/schemas/MachineQuality"

    StockoutItem:
      type: object
      required: [itemCode, colour, category, stock, pendingOrder]
      properties:
        itemCode: { type: string }
        colour: { type: string }
        category: { type: string }
        stock: { type: number }
        pendingOrder: { type: number }

    MonitoringBacklog:
      type: object
      required: [month, stockoutItems]
      properties:
        month: { type: string }
        stockoutItems:
          type: array
          items:
            $ref: "#/components/schemas/StockoutItem"

    ItemWeight:
      type: object
      required: [id, itemCode, colour, weightKg]
      properties:
        id: { type: integer }
        itemCode: { type: string }
        colour: { type: string }
        weightKg: { type: ["string", "null"] }

    ItemWeightUpsert:
      type: object
      required: [itemCode, weightKg]
      properties:
        itemCode: { type: string }
        colour: { type: string }
        weightKg: { type: ["number", "null"] }

    IdealHoursOverride:
      type: object
      required: [id, machineId, month, hours]
      properties:
        id: { type: integer }
        machineId: { type: string }
        month: { type: string }
        hours: { type: string }

    IdealHoursOverrideUpsert:
      type: object
      required: [machineId, month, hours]
      properties:
        machineId: { type: string }
        month: { type: string }
        hours: { type: number }

    WarningThresholds:
      type: object
      required:
        - behindPaceHigh
        - behindPaceCritical
        - catchupInfeasibleRatio
        - stockoutDaysCover
        - noProductionDays
        - highRejectionHigh
        - highRejectionCritical
        - lowUtilisation
        - backlogAgedDays
      properties:
        behindPaceHigh: { type: number }
        behindPaceCritical: { type: number }
        catchupInfeasibleRatio: { type: number }
        stockoutDaysCover: { type: number }
        noProductionDays: { type: number }
        highRejectionHigh: { type: number }
        highRejectionCritical: { type: number }
        lowUtilisation: { type: number }
        backlogAgedDays: { type: number }

    MonitoringConfig:
      type: object
      required: [month, workingDays, shiftsPerDay, shiftHours, snapshotDate]
      properties:
        month: { type: string }
        workingDays: { type: integer }
        shiftsPerDay: { type: integer }
        shiftHours: { type: integer }
        snapshotDate: { type: ["string", "null"] }

    MonitoringConfigUpdate:
      type: object
      required: [month]
      properties:
        month: { type: string }
        workingDays: { type: integer }
        shiftsPerDay: { type: integer }
        shiftHours: { type: integer }
        snapshotDate: { type: ["string", "null"] }

    AiAnalysisResult:
      type: object
      required: [executive_summary, key_findings, root_cause_hypotheses, risks, recommendations, watch_items]
      properties:
        executive_summary: { type: string }
        key_findings:
          type: array
          items:
            type: object
            required: [finding, evidence, scope]
            properties:
              finding: { type: string }
              evidence: { type: string }
              scope: { type: string }
        root_cause_hypotheses:
          type: array
          items:
            type: object
            required: [hypothesis, supporting_signal, confidence]
            properties:
              hypothesis: { type: string }
              supporting_signal: { type: string }
              confidence: { type: string, enum: [high, med, low] }
        risks:
          type: array
          items:
            type: object
            required: [risk, severity, basis]
            properties:
              risk: { type: string }
              severity: { type: string, enum: [Critical, High, Medium] }
              basis: { type: string }
        recommendations:
          type: array
          items:
            type: object
            required: [action, rationale, quantified_impact, priority, effort, scope]
            properties:
              action: { type: string }
              rationale: { type: string }
              quantified_impact: { type: string }
              priority: { type: integer }
              effort: { type: string, enum: [low, med, high] }
              scope: { type: string }
        watch_items:
          type: array
          items: { type: string }

    AiAnalysisSummary:
      type: object
      required: [id, month, snapshotDate, depth, model, createdAt]
      properties:
        id: { type: integer }
        month: { type: string }
        snapshotDate: { type: ["string", "null"] }
        depth: { type: string, enum: [standard, deep] }
        model: { type: string }
        createdAt: { type: string }

    AiAnalysisMessage:
      type: object
      required: [id, role, content, createdAt]
      properties:
        id: { type: integer }
        role: { type: string, enum: [user, assistant] }
        content: { type: string }
        createdAt: { type: string }

    AiAnalysisDetail:
      allOf:
        - $ref: "#/components/schemas/AiAnalysisSummary"
        - type: object
          required: [result, messages]
          properties:
            result:
              anyOf:
                - $ref: "#/components/schemas/AiAnalysisResult"
                - type: "null"
            messages:
              type: array
              items:
                $ref: "#/components/schemas/AiAnalysisMessage"
