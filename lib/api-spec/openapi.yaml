          items: { $ref: "#/components/schemas/CorrectiveWeekStat" }
        warnings:
          type: array
          items: { $ref: "#/components/schemas/CorrectiveWarning" }
        items:
          type: array
          items: { $ref: "#/components/schemas/CorrectiveItemResult" }
        categories:
          type: array
          items: { $ref: "#/components/schemas/CorrectiveCategoryResult" }
          description: "Per-category aggregates with variance attribution (P7)"
        unplannedProduction:
          type: array
          items:
            type: object
            required: [code, qty]
            properties:
              code: { type: string }
              qty: { type: integer }
          description: "Plumbing Sheet3 codes not matched to any plan item"
        baselinePlanRunId: { type: ["integer", "null"], description: "Immutable plan run cited as the baseline (null = live rebuild)" }
        baselineSource: { type: string, enum: [frozen-run, live], description: "Where the original plan baseline came from" }
        unplannedTotal: { type: integer, description: "Sum of unplannedProduction quantities" }

    CategoryCapacity:
      type: object
      required: [id, category, meanPerDay, p90PerDay, bestDay, daysObserved, trailingDays, isThinData, suggestedCapacity, workingDaysPerWeek, planNeedsPerDay, appliedCapacity, lastComputedAt]
      properties:
        id: { type: integer }
        category: { type: string }
        meanPerDay: { type: number }
        p90PerDay: { type: number }
        bestDay: { type: number }
        daysObserved: { type: integer }
        trailingDays: { type: integer }
        isThinData: { type: integer, description: "1 = fewer than 10 producing days observed — treat as indicative only" }
        suggestedCapacity: { type: number }
        overrideCapacity: { type: ["number", "null"] }
        appliedCapacity: { type: number, description: "override if set, else suggested — all modules use this" }
        workingDaysPerWeek: { type: integer }
        planNeedsPerDay: { type: number }
        lastComputedAt: { type: string }

    CategoryCapacityUpdate:
      type: object
      properties:
        overrideCapacity: { type: ["number", "null"] }
        workingDaysPerWeek: { type: integer }

    CorrectivePlanRunSummary:
      type: object
      required: [id, segment, month, weekClosed, dailyCapacity, producedToDate, newOrdersQty, originalMonthTotal, revisedMonthTotal, unfulfillableQty, warnings, createdAt]
      properties:
        id: { type: integer }
        segment: { type: string }
        month: { type: string }
        weekClosed: { type: integer }
        asOfDate: { type: ["string", "null"] }
        note: { type: ["string", "null"] }
        dailyCapacity: { type: number }
        producedToDate: { type: number }
        newOrdersQty: { type: number }
        originalMonthTotal: { type: number }
        revisedMonthTotal: { type: number }
        unfulfillableQty: { type: number }
        planRunId: { type: ["integer", "null"], description: "Immutable plan run cited as the baseline (null = live rebuild)" }
        warnings:
          type: array
          items: { $ref: "#/components/schemas/CorrectiveWarning" }
        createdAt: { type: string }

    PlantWeeklyCategoryRow:
      type: object
      required: [category, weeks]
      properties:
        category: { type: string }
        weeks:
          type: array
          items:
            $ref: "#/components/schemas/PlantWeeklyStats"

    PlantWeeklyPlantSummary:
      type: object
      required: [weeks]
      properties:
        weeks:
          type: array
          items:
            $ref: "#/components/schemas/PlantWeeklyStats"

    PlantWeeklySummary:
      type: object
      required: [month, snapshotDate, weekCalendar, currentWeek, elapsedDaysInWeek, plant, categories]
      properties:
        month: { type: string }
        snapshotDate:
          nullable: true
          type: string
        weekCalendar:
          type: array
          items:
            $ref: "#/components/schemas/PlantWeekWindow"
        currentWeek: { type: integer }
        elapsedDaysInWeek: { type: integer }
        plant:
          $ref: "#/components/schemas/PlantWeeklyPlantSummary"
        categories:
          type: array
          items:
            $ref: "#/components/schemas/PlantWeeklyCategoryRow"

    ApiKey:
      type: object
      required: [id, name, keyPrefix, isActive, createdAt]
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: ["string", "null"] }
        keyPrefix: { type: string, description: "First 14 chars of the key for identification — safe to display" }
        isActive: { type: boolean }
        createdAt: { type: string }
        lastUsedAt: { type: ["string", "null"] }

    ApiKeyWithSecret:
      allOf:
        - $ref: "#/components/schemas/ApiKey"
        - type: object
          required: [key]
          properties:
            key:
              type: string
              description: "Full API key — shown exactly once on create/regenerate, never stored in plaintext"

    CreateApiKeyRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, description: "Human-readable label for this key, e.g. prayag-plant.com" }
        description: { type: string, description: "Optional notes about where this key is used" }

    PlantLiveError:
      type: object
      required: [error]
      properties:
        error: { type: string }

    PlantLivePlant:
      type: object
      required: [code, name, location, daily_wired, daily_months]
      properties:
        code: { type: string }
        name: { type: string }
        location: { type: string }
        daily_wired: { type: boolean }
        daily_months:
          type: array
          items: { type: string }

    PlantLivePlantsResponse:
      type: object
      required: [plants]
      properties:
        plants:
          type: array
          items:
            $ref: "#/components/schemas/PlantLivePlant"

    PlantLiveMachineMetrics:
      type: object
      required: [headline, headline_label, headline_rating, unit]
      properties:
        headline: { type: ["number", "null"] }
        headline_label: { type: string }
        headline_rating: { type: string }
        utilisation: { type: ["number", "null"] }
        util_rating: { type: string }
        util_available: { type: boolean }
        output_efficiency: { type: ["number", "null"] }
        oee: { type: ["number", "null"] }
        oee_rating: { type: string }
        good_count: { type: ["number", "null"] }
        total_count: { type: ["number", "null"] }
        reject_count: { type: ["number", "null"] }
        rejection_pct: { type: ["number", "null"] }
        actual_hours: { type: ["number", "null"] }
        ideal_hours: { type: ["number", "null"] }
        unit: { type: string }
        row_count: { type: integer }
        baseline_set: { type: boolean }
        warnings:
          type: array
          items: { type: string }

    PlantLivePeriodsResponse:
      type: object
      required: [period_tokens, months_with_data]
      properties:
        period_tokens:
          type: array
          items: { type: string }
        months_with_data:
          type: array
          items: { type: string }

    PlantLiveRecordRow:
      type: object
      description: Raw production row with provenance; upstream may add fields.
      additionalProperties: true
      properties:
        date: { type: string }
        plant: { type: string }
        machine: { type: string }
        segment: { type: string }
        period: { type: string }
        grain: { type: string }
        unit: { type: string }
        total_count: { type: ["number", "null"] }
        reject_count: { type: ["number", "null"] }
        actual_hours: { type: ["number", "null"] }
        ideal_hours: { type: ["number", "null"] }
        downtime_min: { type: ["number", "null"] }
        source_family: { type: string }
        source_file: { type: string }
        source_tab: { type: string }

    PlantLiveRecordsResponse:
      type: object
      required: [period, rows, row_count]
      properties:
        period:
          $ref: "#/components/schemas/PlantLivePeriod"
        rows:
          type: array
          items:
            $ref: "#/components/schemas/PlantLiveRecordRow"
        row_count: { type: integer }
        confirmation_status: { type: string }
        figures_gated: { type: boolean }
        quarantined:
          type: array
          items: {}

    PlantLivePeriod:
      type: object
      required: [requested, label, from, to]
      properties:
        requested: { type: string }
        label: { type: string }
        from: { type: string }
        to: { type: string }

    PlantLiveSummaryResponse:
      type: object
      required: [period, by_machine, by_date]
      properties:
        period:
          $ref: "#/components/schemas/PlantLivePeriod"
        row_count: { type: integer }
        by_machine:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/PlantLiveMachineMetrics"
        by_date:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/PlantLiveMachineMetrics"

    PlumbingMachine:
      type: object
      required: [id, segment, pool, machineId, shiftsPerDay, hoursPerShift, workingDays, rates, lockedOut]
      properties:
        id: { type: integer }
        segment: { type: string }
        pool: { type: string, description: "PIPE or MOULDING" }
        machineId: { type: string }
        label: { type: ["string", "null"] }
        shiftsPerDay: { type: number }
        hoursPerShift: { type: number }
        workingDays: { type: integer }
        rates:
          type: object
          additionalProperties: { type: number }
          description: "Per-material kg/hr rates (PIPE: CPVC/UPVC/SWR/AGRI; MOULDING: ALL)"
        lockedOut: { type: boolean }

    PlumbingMachineUpdate:
      type: object
      properties:
        shiftsPerDay: { type: number }
        hoursPerShift: { type: number }
        workingDays: { type: number, description: "Monthly working days for capacity calculation" }
        lockedOut: { type: boolean }
        rates:
          type: object
          additionalProperties: { type: number }
          description: "Per-material production rates in kg/hr. Keys are material codes (e.g. CPVC, ALL)."

    MachineWeekUtilisation:
      type: object
      required: [machineId, pool, label, week, hoursUsed, hoursAvailable, utilisationPct]
      properties:
        machineId: { type: string }
        pool: { type: string }
        label: { type: ["string", "null"] }
        week: { type: integer, description: "1–4" }
        hoursUsed: { type: number }
        hoursAvailable: { type: number }
        utilisationPct: { type: number }

    MachineUnfulfillableItem:
      type: object
      required: [itemCode, category, pieces, bindingMachine]
      properties:
        itemCode: { type: string }
        category: { type: string }
        pieces: { type: number }
        bindingMachine:
          type: ["string", "null"]
          description: "Machine ID that was most loaded (bottleneck) when this item could not be placed."

    MachineFeasibleCategorySummary:
      type: object
      required: [category, desiredPcs, feasiblePcs, unfulfillablePcs]
      properties:
        category: { type: string }
        desiredPcs: { type: number }
        feasiblePcs: { type: number }
        unfulfillablePcs: { type: number }

    MachineFeasibleSummary:
      type: object
      required: [categories, utilisation, unfulfillable]
      properties:
        categories:
          type: array
          items: { $ref: "#/components/schemas/MachineFeasibleCategorySummary" }
        utilisation:
          type: array
          items: { $ref: "#/components/schemas/MachineWeekUtilisation" }
        unfulfillable:
          type: array
          items: { $ref: "#/components/schemas/MachineUnfulfillableItem" }

    MachineCapacityResponse:
      type: object
      required: [machines, utilisation, unfulfillable]
      properties:
        machines:
          type: array
          items:
            $ref: "#/components/schemas/PlumbingMachine"
        utilisation:
          type: array
          items:
            $ref: "#/components/schemas/MachineWeekUtilisation"
        unfulfillable:
          type: array
          items:
            $ref: "#/components/schemas/MachineUnfulfillableItem"

