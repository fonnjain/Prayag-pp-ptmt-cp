          description: "Capabilities granted to this key."
        segmentScopes:
          type: array
          minItems: 1
          items: { type: string, enum: [PTMT, Plumbing] }
          description: "Plant segments this key may read or mutate."
        keyPrefix: { type: string, description: "First 14 chars of the key for identification — safe to display" }
        isActive: { type: boolean }
        createdAt: { type: string }
        lastUsedAt: { type: ["string", "null"] }

    ApiKeyWithSecret:
      allOf:
        - $ref: "#/components/schemas/ApiKey"
        - type: object
          required: [key]
          properties:
            key:
              type: string
              description: "Full API key — shown exactly once on create/regenerate, never stored in plaintext"

    CreateApiKeyRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, description: "Human-readable label for this key, e.g. prayag-plant.com" }
        description: { type: string, description: "Optional notes about where this key is used" }
        consumer:
          type: string
          enum: [machine-analysis, mis, legacy]
          default: legacy
          description: "The external consumer identity used to select the rate-limit policy."
        scopes:
          type: array
          minItems: 1
          items: { type: string, enum: [read, write] }
          description: "Capabilities granted to this key."
        segmentScopes:
          type: array
          minItems: 1
          items: { type: string, enum: [PTMT, Plumbing] }
          description: "Plant segments this key may read or mutate."

    PlantLiveError:
      type: object
      required: [error]
      properties:
        error: { type: string }
