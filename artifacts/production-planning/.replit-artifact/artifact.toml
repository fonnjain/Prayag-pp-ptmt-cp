kind = "web"
previewPath = "/"
title = "PTMT Production Planning"
version = "1.0.0"
id = "artifacts/production-planning"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21470

[services.development]
run = "pnpm --filter @workspace/production-planning run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/production-planning", "run", "build" ]
publicDir = "artifacts/production-planning/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21470"
BASE_PATH = "/"

[[services]]
name = "api"
paths = [ "/api" ]
localPort = 8080

[services.development]
run = "pnpm --filter @workspace/api-server run dev"

[services.production]
build = [ "sh", "-c", "cd artifacts/api-server && node esbuild.build.mjs" ]
run = "node artifacts/api-server/dist/index.cjs"

[services.env]
PORT = "8080"
NODE_ENV = "production"
