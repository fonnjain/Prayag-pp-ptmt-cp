kind = "slides"
previewPath = "/prayag-production-operations-deck/"
title = "Prayag India Production Planning & Operations"
description = "A presentation deck explaining the Prayag India production planning and operations platform, including demand and executable production, capacity intelligence, machine release, monitoring, corrective action, governance, and next priorities."
version = "1.0.0"
id = "artifacts/prayag-production-operations-deck"
router = "path"

[[services]]
name = "web"
paths = [ "/prayag-production-operations-deck/" ]
localPort = 20532

[services.development]
run = "pnpm --filter @workspace/prayag-production-operations-deck run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/prayag-production-operations-deck", "run", "build" ]
serve = "static"
publicDir = "artifacts/prayag-production-operations-deck/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20532"
BASE_PATH = "/prayag-production-operations-deck/"
