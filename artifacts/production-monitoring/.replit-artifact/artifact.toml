kind = "web"
previewPath = "/monitoring/"
title = "PTMT Production Performance & Monitoring"
version = "1.0.0"
id = "artifacts/production-monitoring"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/monitoring/" ]
localPort = 23586

[services.development]
run = "pnpm --filter @workspace/production-monitoring run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/production-monitoring", "run", "build" ]
publicDir = "artifacts/production-monitoring/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23586"
BASE_PATH = "/monitoring/"
